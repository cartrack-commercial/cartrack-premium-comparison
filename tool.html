    el('div', { class: 'bs ' + (hhRow.d == null ? '' : hhRow.d < -0.5 ? 'g' : hhRow.d > 0.5 ? 'r' : '') },
      el('div', { class: 'k' }, 'Difference / month'),
      el('div', { class: 'v num' }, hhRow.d == null ? '—' : (hhRow.d > 0 ? '+' : '') + crMoney(hhRow.d)))) : null;
  return el('div', { class: 'cr-sec' },
    el('div', { class: 'cr-sh' },
      el('span', { class: 'ic', html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8 12 3l9 5v8l-9 5-9-5V8Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>' }),
      el('h2', {}, title),
      sub ? el('span', { class: 'sub' }, sub) : null),
    bstat,
    el('div', { class: 'cr-tw' }, el('table', {}, el('thead', {}, head), el('tbody', {}, ...body, totRow))),
    hhRow ? crBuildingStrip(hhRow) : null);
}

// --- "How we do it now": cover-first findings, so the recommendation follows
//     the manual rule — dearer-but-better still moves; only a genuine cover gap holds.
// A line the CURRENT policy covers but an option did not quote (or a limit it drops).
function crCoverFindings(withQuotes) {
  const gaps = [], reductions = [], checks = [], adequacy = [];
  withQuotes.forEach(b => {
    const opts = optionQuotes(b);
    sectionUnion(opts).forEach(sec => {
      const curCell = curCellFor(opts, sec.key);
      const curHas = curCell && (curCell.cur != null || curCell.curL || curCell.curIncl || curCell.curStr);
      const kind = crKind(sec.label);
      opts.forEach(q => {
        const who = q.insurer || 'Cartrack';
        const l = q.lines.find(x => secKey(x.s) === sec.key);
        if (curHas && (!l || l.propNq)) { if (kind !== 'sasria' && kind !== 'fees') gaps.push({ who, sec: sec.label, building: b.name }); }
        else if (l && !l.propNq && (kind === 'liability' || kind === 'cover')) {
          const cl = curCell ? parseLimit(curCell.curL) : null, pl = parseLimit(l.propL);
          if (cl != null && pl != null && pl < cl - 0.5) reductions.push({ who, sec: sec.label, building: b.name, from: cl, to: pl });
        }
      });
      if (kind === 'excess') {
        const anyPct = (curCell && /%/.test((curCell.curStr || curCell.curL || '')))
          || opts.some(q => { const l = q.lines.find(x => secKey(x.s) === sec.key); return l && !l.propNq && /%/.test((l.propStr || l.propL || '')); });
        if (anyPct) checks.push({ sec: sec.label, building: b.name });
      }
      if (kind === 'liability') {
        const lims = [curCell ? parseLimit(curCell.curL) : null,
          ...opts.map(q => { const l = q.lines.find(x => secKey(x.s) === sec.key); return l && !l.propNq ? parseLimit(l.propL) : null; })].filter(v => v != null);
        if (lims.length) {
          const best = Math.max(...lims);
          const fleet = /fleet|vehicle|motor|transport/i.test((state.client.type || '') + ' ' + b.name);
          const floor = fleet ? 10000000 : 5000000;
          if (best < floor - 0.5) adequacy.push({ sec: sec.label, building: b.name, best, floor, fleet });
        }
      }
    });
  });
  return { gaps, reductions, checks, adequacy };
}

// Count of cover lines each option leaves unquoted that the current policy holds.
function crGapCounts(withQuotes, options) {
  const gc = {}; options.forEach(o => gc[o.key] = 0);
  withQuotes.forEach(b => {
    const opts = optionQuotes(b);
    sectionUnion(opts).forEach(sec => {
      const curCell = curCellFor(opts, sec.key);
      const curHas = curCell && (curCell.cur != null || curCell.curL || curCell.curIncl || curCell.curStr);
      if (!curHas || crKind(sec.label) === 'sasria' || crKind(sec.label) === 'fees') return;
      opts.forEach(q => { const key = q.optionId || q.id; if (!(key in gc)) return;
        const l = q.lines.find(x => secKey(x.s) === sec.key); if (!l || l.propNq) gc[key]++; });
    });
  });
  return gc;
}

// Recommend the cheapest option that does NOT open a cover gap; only if every
// option has gaps do we fall back to cheapest and flag it. (Upgrade, not downgrade.)
function crRecommendId(withQuotes, options) {
  if (!options.length) return null;
  const gc = crGapCounts(withQuotes, options);
  const minGap = Math.min(...options.map(o => gc[o.key]));
  const eligible = options.filter(o => gc[o.key] === minGap);
  const rec = eligible.reduce((m, e) => (m == null || e.prop < m.prop) ? e : m, null);
  return rec ? rec.key : null;
}

// RM-only view: the internal findings & actions, hidden from the client copy.
// ---------------------------------------------------------------------------
// Schedule audit — the judgement an experienced RM applies by hand, encoded.
//
// Every rule here comes from a live comparison where the finding decided the
// deal. Rules that compare CURRENT against PROPOSED matter most: a quote can be
// cheaper and still be the wrong answer. Severities: 'gap' (cover missing or
// lost), 'play' (a Cartrack opportunity), 'time' (timing/forfeiture),
// 'check' (verify before binding).
// ---------------------------------------------------------------------------
function _auditText(kind) {
  return ((state.files && state.files[kind]) || [])
    .filter(f => f && f.status === 'ok').map(f => f.text || '').join('\n');
}
// Retroactive dates on a claims-made liability section. Returns the EARLIEST
// found: that is how far back the policy actually reaches.
function _retroDates(text) {
  const out = [];
  const re = /retro[\s-]*active\s*date\s*[:\s]*([0-3]?\d[\/\-. ][0-1]?\d[\/\-. ](?:19|20)?\d{2}|(?:19|20)\d{2}[\/\-.][0-1]?\d[\/\-.][0-3]?\d|[0-3]?\d\s+\w{3,9}\s+(?:19|20)\d{2})/gi;
  let m; while ((m = re.exec(text || ''))) {
    const d = new Date(m[1].replace(/[.\s]/g, '/').replace(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/, '$1/$2/20$3')
      .replace(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/, '$3-$2-$1'));
    if (!isNaN(d)) out.push(d);
  }
  return out.sort((a, b) => a - b);
}
function _fmtD(d) { return d.toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' }); }
function _countVehicles(text) {
  const t = text || '';
  const regs = new Set();
  for (const m of t.matchAll(/\b([A-Z]{2,3}\s?\d{2,3}\s?[A-Z]{2}GP|[A-Z]{3}\s?\d{3}\s?[A-Z]{2}|\d{3}\s?[A-Z]{3}\s?[A-Z]{2})\b/g)) regs.add(m[1].replace(/\s/g, ''));
  return regs.size;
}

function crScheduleAudit() {
  const cur = _auditText('schedule');
  const prop = _auditText('quote');
  if (!cur.trim() && !prop.trim()) return [];
  const lc = cur.toLowerCase(), lp = prop.toLowerCase(), both = (lc + '\n' + lp);
  const anyIn = (h, ...ws) => ws.some(w => h.includes(w));
  const any = (...ws) => anyIn(both, ...ws);
  const kind = (state.client.type || '') + ' ' + (state.client.name || '');
  const fleet = /fleet|vehicle|motor|transport|haul|courier/i.test(kind) || /motor section|vehicle schedule/i.test(both);
  const contractor = /contract|electric|engineer|construct|plumb|build|install|mechanic/i.test(kind + ' ' + both.slice(0, 4000));
  const out = [];
  const push = (sev, tag, title, detail) => out.push({ sev, tag, title, detail });

  /* ---- 1. Claims-made retroactive date: the highest-value catch ---------- */
  if (/claims\s*made/i.test(both)) {
    const cD = _retroDates(cur), pD = _retroDates(prop);
    if (prop && /retro[\s-]*active\s*date\s*[:\s]*(?:inception|policy\s+inception|inception\s+date)/i.test(prop)) {
      push('gap', 'Retro date', 'Proposed liability restarts the retroactive date at inception',
        'The quotation sets the claims-made retroactive date to the <b>inception date of the policy</b>. Claims-made liability only answers for work done <i>after</i> that date, so <b>every job the client has already completed would fall out of cover on day one</b>. Get the existing retroactive date carried across <b>in writing</b> before binding — this is not a price question.');
    } else if (cD.length && pD.length && pD[0] - cD[0] > 32 * 864e5) {
      const months = Math.round((pD[0] - cD[0]) / (30.44 * 864e5));
      push('gap', 'Retro date', 'Proposed retroactive date is ' + months + ' months later than the current policy',
        'Current cover reaches back to <b>' + _fmtD(cD[0]) + '</b>; the proposal starts at <b>' + _fmtD(pD[0]) + '</b>. On claims-made liability that leaves roughly <b>' + months + ' months of completed work uninsured</b>. Ask the insurer to match the existing date or earlier.');
    } else if (cD.length && !pD.length && prop) {
      push('check', 'Retro date', 'No retroactive date stated on the proposal',
        'The current policy carries a retroactive date of <b>' + _fmtD(cD[0]) + '</b> but the quotation does not state one. Unpinned it may default to inception and silently drop past work. <b>Pin it in writing before binding.</b>');
    }
    if (cD.length > 1 && (cD[cD.length - 1] - cD[0]) > 32 * 864e5) {
      push('check', 'Retro date', 'Mismatched retroactive dates on the current policy',
        'The current liability sections carry different retroactive dates (' + _fmtD(cD[0]) + ' to ' + _fmtD(cD[cD.length - 1]) + '). Where a primary and an excess layer do not share a date, the upper layer may not respond to a claim the primary accepts. Worth raising with the client either way.');
    }
  }

  /* ---- 2. Products liability / defective workmanship --------------------- */
  if (contractor) {
    const excluded = /products?\s+liability[^\n]{0,80}(?:excluded|not\s+covered|\bnil\b|r\s?0[.,]00|\br0\b)|defective\s+workmanship[^\n]{0,60}(?:excluded|no\b|\bnil\b|r\s?0[.,]00)/i.test(both)
      || (/products?\s+liability|defective\s+workmanship/i.test(both) && /:\s*no\b/i.test(both));
    if (excluded || !/products?\s+liability/i.test(both)) {
      push('gap', 'Gap', 'Defective workmanship / products liability not covered',
        'This is a contracting or installation risk, and the work itself is the client’s largest exposure — a fire or failure traced to work done months earlier. <b>Products liability and defective workmanship appear to be excluded or unquoted.</b> Ask both insurers to price it so the client decides with a number rather than an assumption.');
    }
  }

  /* ---- 3. Umbrella / excess layer that cannot attach --------------------- */
  if (/minimum\s+underlying\s+limit/i.test(prop || both)) {
    push('gap', 'Gap', 'Umbrella carries a minimum-underlying-limit condition',
      'The excess/umbrella section only attaches once the underlying sections meet a stated minimum limit. <b>Check each underlying limit against that condition</b> — where the underlying is lower (employers liability and products are the usual offenders) the client carries the difference themselves before the umbrella responds, and the headline limit is illusory.');
  }

  /* ---- 4. Passenger liability (crews / fare-paying) ---------------------- */
  if (fleet && /passenger\s+liability/i.test(both)) {
    const grab = (h) => { const m = /passenger\s+liability[^\n]{0,60}?R?\s?([\d][\d\s.,]*)/i.exec(h); return m ? parseMoney2(m[1]) : null; };
    const c = grab(cur), p = grab(prop);
    if (c && p && p < c * 0.95) {
      push('gap', 'Cover ↓', 'Passenger liability reduced',
        'Passenger liability drops from <b>' + fmtR(c) + '</b> to <b>' + fmtR(p) + '</b>. Where vehicles carry crews or fare-paying passengers this is usually the decisive cover on the whole file — confirm the client accepts it in writing, or have it lifted back.');
    }
    if (/e-?hailing|e\s?hailing/i.test(prop)) {
      push('gap', 'Wording', 'Passenger liability sits on an e-hailing form',
        'The proposed passenger liability wording references <b>e-hailing</b>. For a scheduled, scholar or charter operator that form may not respond at all. Get written confirmation from the underwriter that it answers for the operation actually run — this is a gate, not a detail.');
    }
  }

  /* ---- 5. Fleet size mismatch between schedule and quotation ------------- */
  if (fleet && cur && prop) {
    const nc = _countVehicles(cur), np = _countVehicles(prop);
    if (nc >= 3 && np >= 1 && np < nc) {
      push('gap', 'Gap', 'The quotation covers fewer vehicles than the schedule',
        'Registration numbers found: <b>' + nc + '</b> on the current schedule against <b>' + np + '</b> on the quotation. A quote that omits vehicles is not a like-for-like comparison and will look cheaper than it is. <b>Reconcile the fleet list and the total sum insured before presenting any saving.</b>');
    }
  }

  /* ---- 6. Sums insured cut on the proposal (average applies) ------------- */
  {
    const si = (h) => { const m = /(?:sum\s+insured|buildings?|rebuild)[^\n]{0,40}?R\s?([\d][\d\s.,]{5,})/i.exec(h); return m ? parseMoney2(m[1]) : null; };
    const c = si(cur), p = si(prop);
    if (c && p && p < c * 0.9) {
      push('gap', 'Cover ↓', 'Sum insured lower on the proposal — average would apply',
        'A leading sum insured falls from about <b>' + fmtR(c) + '</b> to <b>' + fmtR(p) + '</b>. Under-insurance triggers <b>average</b>: the client bears a proportionate share of <i>every</i> claim, not just a total loss. Confirm the values are deliberate, or have the quote rebuilt to the correct figures before comparing price.');
    }
  }

  /* ---- 7. Valuation basis on specialist / collector vehicles ------------- */
  if (/agreed\s+value/i.test(cur) && prop && !/agreed\s+value/i.test(prop)) {
    push('gap', 'Cover ↓', 'Agreed value not carried across to the proposal',
      'The current policy insures at least one vehicle on an <b>agreed value</b> basis; the proposal appears to use retail/market value. On specialist, collector or appreciating vehicles that is a real reduction — retail books understate them, and the shortfall only appears at claim stage.');
  }

  /* ---- 8. Contents / section carve-outs ---------------------------------- */
  {
    const m = /contents[^\n]{0,40}\(\s*excluding([^)]{3,60})\)/i.exec(prop || '');
    if (m) push('gap', 'Gap', 'Contents quoted with an exclusion',
      'The proposed contents section is quoted <b>excluding' + crEsc(m[1]) + '</b>. Anything carved out here needs its own section or it is simply uninsured — check whether a matching electronic-equipment or stock section exists on the quote.');
  }

  /* ---- 9. Tracking: condition, contradiction, and the Cartrack lead ------ */
  if (both.includes('telematics') && any('waiver', 'excess waiver')) {
    push('play', 'The play', 'Telematics excess waiver is on this schedule',
      'The underwriter waives the theft/hijack excess for an approved telematics unit. <b>Confirm Cartrack is on their approved list</b> — if it is, a Cartrack unit eliminates that excess on every vehicle (often the single biggest number on the file). If it is not, escalate to get Cartrack accredited — it applies to every risk this underwriter writes.');
  } else if (fleet && any('tracking', 'track and trace', 'tracking device', 'approved tracking', 'stolen vehicle recovery', 'early warning')) {
    push('play', 'The play', 'Tracking condition — Cartrack angle',
      'The policy or quotation requires tracking for theft and hijack cover. Verify every vehicle has an <b>approved</b> device recorded (a blank field can mean a repudiated theft claim), and note the fitment deadline — where units are outstanding this is both a live cover condition and a <b>Cartrack unit sale</b>.');
  }
  if (/(?:below|under|less than|up to)\s*R?\s?3[05]0[\s,]?000[^\n]{0,120}(?:immobilis|alarm)/i.test(prop) &&
      /theft[^\n]{0,80}subject[^\n]{0,60}(?:tracking|vesa)/i.test(prop)) {
    push('check', 'Wording', 'Motor security wording contradicts itself',
      'The quotation says vehicles under a stated value need only an immobiliser or alarm, but a closing clause makes <b>all</b> theft cover subject to an approved tracking device. Read literally the second clause wins and every vehicle needs a unit. <b>Get it clarified in writing</b> — otherwise a theft claim can be repudiated on a vehicle the client believed compliant.');
  }

  /* ---- 10. Warranties that are conditions precedent ---------------------- */
  {
    const w = [];
    if (/surge\s+arrest|arrestor\s+warranty/i.test(prop)) w.push('surge arrestor');
    if (/certificate\s+of\s+electrical\s+compliance|electrical\s+certificate/i.test(prop)) w.push('electrical CoC');
    if (/fire[\s-]*fighting\s+equipment|fire\s+extinguish\w*\s+warranty/i.test(prop)) w.push('fire equipment');
    if (/alarm\s+warranty/i.test(prop)) w.push('linked alarm');
    if (w.length) push('check', 'Warranty', 'Conditions precedent on the proposal: ' + w.join(', '),
      'These are <b>warranties, not suggestions</b> — if the requirement is not in place at the time of loss the claim can fail even where cover clearly exists. Walk them with the client and confirm each is met and documented on day one.');
  }

  /* ---- 11. Third-party sub-limits hidden under a headline limit ---------- */
  if (/fire\s+(?:and|&)\s+explosion[^\n]{0,40}R?\s?\d/i.test(prop) && /third\s+party/i.test(prop)) {
    push('check', 'Wording', 'Third-party liability carries a fire/explosion sub-limit',
      'The proposed third-party section shows a separate, lower limit for <b>fire and explosion</b>. The headline third-party figure is not what responds to a fire claim — quote the sub-limit to the client, not the headline.');
  }

  /* ---- 12. Insurer identity / paper mismatch ---------------------------- */
  {
    const ins = ['bryte', 'hollard', 'santam', 'guardrisk', 'old mutual', 'infiniti', 'renasa', 'compass', 'western', 'king price'];
    const named = ins.filter(n => lp.includes(n));
    if (named.length > 1 && /quotation\s*[-–—]\s*(\w+)/i.test(prop)) {
      push('check', 'Check', 'More than one insurer named on the quotation',
        'The quotation references <b>' + named.map(crEsc).join(', ') + '</b>. Where the title and the page footer disagree, confirm <b>which insurer actually carries the risk</b> and have the document reissued on the correct paper before it goes to the client.');
    }
  }

  /* ---- 13. Stale current schedule --------------------------------------- */
  {
    const ds = [...cur.matchAll(/(?:print(?:ed)?\s*date|date\s*printed)\s*[:\s]*([0-3]?\d[\/\-. ][0-1]?\d[\/\-. ](?:19|20)\d{2})/gi)]
      .map(m => new Date(m[1].replace(/[.\s]/g, '/').replace(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/, '$3-$2-$1'))).filter(d => !isNaN(d));
    if (ds.length) {
      const newest = new Date(Math.max(...ds));
      const months = Math.round((Date.now() - newest) / (30.44 * 864e5));
      if (months >= 10) push('check', 'Stale', 'The current schedule is about ' + months + ' months old',
        'The most recent print date found on the current policy is <b>' + _fmtD(newest) + '</b>. Premiums and sums insured will have moved at renewal since then, so any saving measured against it is unreliable. <b>Get the latest schedule before quoting a number to the client.</b>');
    }
  }

  /* ---- 14. Fund / profit share and the timing of a move ------------------ */
  // Deliberately narrow: a no-claim bonus sits on almost every motor policy and
  // is not a forfeiture risk. Only real fund / profit-share mechanisms qualify.
  if (any('profit share', 'profit-share', 'cash back', 'cash-back', 'savings fund',
          'policy fund', 'reserve account', 'reserve fund', 'claims fund', 'own fund')
      || /loss\s+ratio[^\n]{0,60}(?:rebate|refund|bonus|return|share|below\s*\d)/i.test(both)) {
    push('time', 'Timing', 'Profit-share / savings fund detected',
      'This policy carries a fund or cash-back mechanism. <b>Moving mid-term may forfeit the accrued reserve.</b> Ask for the current fund balance and loss ratio, time the move to renewal, and disclose the forfeiture to the client in writing — a replacement-of-policy requirement, not a tactic.');
  }

  /* ---- 15. Financed assets without shortfall cover ---------------------- */
  if (any('finance', 'financ', 'instal', 'standard bank', 'wesbank', 'absa', 'nedbank', 'motor finance', 'asset finance', 'albaraka')
      && !any('credit shortfall', 'shortfall', 'gap cover', 'top up', 'top-up')) {
    push('gap', 'Gap', 'Financed assets — no credit shortfall found',
      'Finance references appear but no credit shortfall / GAP cover was detected. On a written-off financed asset the insurer pays market value while the bank is owed the settlement balance — the client pays the difference in cash. Price shortfall on every financed unit.');
  }

  /* ---- 16. Goods in transit on a transport risk ------------------------- */
  if (fleet && !any('goods in transit', 'goods-in-transit', ' git ', 'git cover')) {
    push('gap', 'Gap', 'No Goods in Transit cover',
      'This is a transport risk and no Goods-in-Transit cover was detected. Cargo in the client’s care, custody & control may be uninsured — confirm whether their trading conditions cap that liability, and whether those conditions are in their customer contracts.');
  }

  /* ---- 17. Cross-border ------------------------------------------------- */
  if (any('namibia', 'mozambique', 'botswana', 'zimbabwe', 'lesotho', 'eswatini', 'swaziland', 'malawi', 'cross-border', 'cross border', 'sadc')) {
    push('check', 'Check', 'Cross-border / territorial terms present',
      'Territorial extensions appear on this policy. Confirm the routes actually driven are covered <b>at vehicle level</b>, not just in the policy header — a mismatch is a live uninsured exposure on every cross-border trip.');
  }

  /* ---- 18. Subject-to conditions that can undo the quote ---------------- */
  if (/subject\s+to[^\n]{0,40}(?:satisfactory\s+)?survey|quote\s+triggers\s+a\s+survey/i.test(prop)) {
    push('check', 'Check', 'Terms are subject to a survey',
      'The quotation is conditional on a satisfactory survey. Terms and price can change afterwards — <b>tell the client the figure is indicative until the survey is cleared</b>, and book it early so inception is not delayed.');
  }
  if (/loss\s+ratio\s+below\s+\d+%|claims\s+experience[^\n]{0,60}(?:required|before)/i.test(prop)) {
    push('check', 'Check', 'Quote is conditional on claims experience',
      'The insurer requires a written claims history (often a three-year loss ratio under 60%) before terms are confirmed. Obtain it up front — a poor ratio can withdraw the quote entirely, and the client should not hear that after being shown a saving.');
  }
  return out;
}

function crRmPanel(findings, audit) {
  const item = (sev, label, txt) => el('div', { class: 'cr-find ' + sev },
    el('span', { class: 'cr-fk' }, label), el('div', { html: txt }));
  const rows = [];
  findings.gaps.forEach(g => rows.push(item('gap', 'Gap',
    '<b>' + crEsc(g.who) + '</b> did not quote <b>' + crEsc(g.sec) + '</b>' + (g.building ? ' (' + crEsc(g.building) + ')' : '')
    + ' — the current policy covers it. Confirm it is intentional or price it before presenting.')));
  findings.reductions.forEach(r => rows.push(item('reduce', 'Cover ↓',
    '<b>' + crEsc(r.who) + '</b> drops <b>' + crEsc(r.sec) + '</b> from ' + fmtLimit(r.from) + ' to ' + fmtLimit(r.to)
    + ' — a reduction in cover. Must be disclosed to the client in writing.')));
  (findings.adequacy || []).forEach(a => rows.push(item('reduce', 'Limit thin',
    '<b>' + crEsc(a.sec) + '</b>' + (a.building ? ' (' + crEsc(a.building) + ')' : '') + ' tops out at ' + fmtLimit(a.best)
    + ' across every option — thin for ' + (a.fleet ? 'a transport risk (heavy haulage commonly carries R10m+)' : 'a commercial risk')
    + '. A single serious claim can exceed it; put a higher limit on the table.')));
  findings.checks.forEach(c => rows.push(item('check', 'Wording',
    'Excess on <b>' + crEsc(c.sec) + '</b>' + (c.building ? ' (' + crEsc(c.building) + ')' : '')
    + ' is percentage-based on at least one side — compare the policy wording, not just the rand figure.')));
  if (!rows.length) rows.push(item('ok', 'Clear',
    'No cover gaps, reductions or limit concerns were found across the compared options. This is a clean upgrade — proceed on price and the cover improvements above.'));
  const auditRows = (audit || []).map(a => item(a.sev, a.tag, '<b>' + crEsc(a.title) + '.</b> ' + a.detail));
  return el('div', { class: 'cr-rm' },
    el('div', { class: 'cr-rm-h' },
      el('span', { class: 'cr-rm-k' }, 'RM view · internal — not on the client copy'),
      el('h2', {}, 'Findings & actions before you present'),
      el('p', {}, 'The move is justified wherever cover holds or improves. Only a genuine cover gap is a reason to stay.')),
    auditRows.length ? el('div', {},
      el('div', { class: 'cr-rm-sub' }, 'Schedule audit · what the wordings say, not just the price'),
      el('div', { class: 'cr-rm-list' }, ...auditRows)) : null,
    el('div', { class: 'cr-rm-sub' }, 'Cover comparison · the proposals against today'),
    el('div', { class: 'cr-rm-list' }, ...rows));
}

function crReco(op, up, rm, findings, hh) {

  if (!r) return null;
  const q = r.q; if (!q) return null;
  const deltas = q.lines.filter(l => !l.propNq && l.cur != null && l.prop != null)
    .map(l => ({ s: l.s, d: +(l.prop - l.cur).toFixed(2) }));
  const win = deltas.filter(x => x.d < -0.5).sort((a, c) => a.d - c.d)[0];
  const drag = deltas.filter(x => x.d > 0.5).sort((a, c) => c.d - a.d)[0];
  const sas = deltas.find(x => /sasria/i.test(x.s));
  const coverD = sas && r.d != null ? +(r.d - sas.d).toFixed(2) : null;
  const strip = (cls, label, txt) => el('div', { class: 'cr-strip ' + cls }, el('b', {}, label), ' — ' + txt);
  if (r.verdict === 'switch') {
    let txt = crMoney(-r.d) + '/mo saving.';
    if (win) txt += ' Biggest win: ' + win.s + ' ' + crMoney(win.d) + '/mo' + (drag ? ' — it absorbs ' + drag.s + ' +' + crMoney(drag.d) + '/mo.' : '.');
    return strip('sw', 'SWITCH', txt);
  }
  if (r.verdict === 'upgrade') {
    let txt = crMoney(r.d) + '/mo more.';
    if (sas && sas.d > 0.5 && coverD != null && coverD < -0.5)
      txt += ' Almost all of it is SASRIA — a government pass-through on the declared value; on the cover itself the proposal is ' + crMoney(-coverD) + '/mo cheaper.';
    else if (sas && sas.d > 0.5 && sas.d >= r.d * 0.6)
      txt += ' Most of it is SASRIA — a government pass-through on the declared value, not the insurer’s own price.';
    const ev = [r.adds ? crWordN(r.adds).toLowerCase() + ' cover line' + (r.adds > 1 ? 's' : '') + ' the current policy does not carry' : '',
      r.upgrades ? crWordN(r.upgrades).toLowerCase() + ' higher limit' + (r.upgrades > 1 ? 's' : '') : ''].filter(Boolean).join(' and ');
    if (ev) txt += ' The extra buys ' + ev + '.';
    return strip('up', 'UPGRADE', txt);
  }
  if (r.verdict === 'review') return strip('rv', 'REVIEW', crMoney(r.d) + '/mo more with no clear cover gain — challenge the rate before inception.');
  if (r.verdict === 'level') return strip('lv', 'LEVEL', 'like-for-like on premium — decide on the cover detail above.');
  return strip('lv', 'CONFIRM', 'the current premium could not be read — complete it on the Review step before presenting.');
}
// Head-to-head: portfolio cards, the building-by-building verdict table,
// a legend, and the Sasria explainer.
function crHeadToHead(withQuotes, op, rows, insMap) {
  const n = rows.length;
  const anyCur = rows.some(r => r.curKnown);
  const totCur = rows.reduce((s, r) => s + (r.curKnown ? r.cur : 0), 0);
  const totProp = rows.reduce((s, r) => s + r.prop, 0);
  const totD = +(totProp - totCur).toFixed(2);
  const saving = anyCur && totD < -0.5, dearer = anyCur && totD > 0.5;
  const recIns = (op.options.find(o => o.key === op.recId) || op.options[0] || {}).insurer || 'Cartrack';
  const kindWord = policyKind() === 'motor' ? 'policies' : 'buildings';
  const strong = saving || rows.some(r => r.upgrades + r.adds > 0);
  const mixCount = new Map();
  rows.forEach(r => { const p = (insMap.get(r.b.id) || {}).primary; if (p) mixCount.set(p, (mixCount.get(p) || 0) + 1); });
  const mix = [...mixCount.entries()].sort((a, c) => c[1] - a[1]).map(([i, c]) => i + ' × ' + c).join(' + ')
    || n + ' current schedule' + (n > 1 ? 's' : '');
  const card = (k, v, sub, cls) => el('div', { class: 'cr-hhc' + (cls ? ' ' + cls : '') },
    el('div', { class: 'k' }, k), el('div', { class: 'v num' }, v), el('div', { class: 's' }, sub));
  const cards = [
    card('Current programme', anyCur ? crMoney(totCur) : '—', anyCur ? mix : 'premium not read — confirm on Review'),
    card('Cartrack proposal', crMoney(totProp), recIns + ' × ' + n + ' · one programme'),
    !anyCur ? card('Variance', '—', 'needs the current premium first')
      : saving ? card('Portfolio saving', crMoney(totD), 'per month · about ' + crMoney(Math.abs(totD) * 12, 0) + ' a year', 'good')
      : dearer ? card('Additional / month', '+' + crMoney(totD), strong ? 'buys the cover upgrades below' : 'per month', 'bad')
      : card('Like-for-like', 'R0', 'same spend, one programme'),
  ];
  const sw = rows.filter(r => r.verdict === 'switch').length,
        upg = rows.filter(r => r.verdict === 'upgrade').length,
        rv = rows.filter(r => r.verdict === 'review').length;
  const bits = [];
  if (sw) bits.push(sw === 1 ? 'one is a straight saving' : crWordN(sw).toLowerCase() + ' are straight savings');
  if (upg) bits.push((upg === 1 ? 'one costs' : crWordN(upg).toLowerCase() + ' cost') + ' a little more and buy' + (upg === 1 ? 's' : '') + ' stronger cover');
  if (rv) bits.push((rv === 1 ? 'one needs' : crWordN(rv).toLowerCase() + ' need') + ' a closer look before moving');
  const lede = 'All figures are monthly, as captured from the schedules and confirmed on the Review step.'
    + (bits.length ? ' Of the ' + n + ' ' + kindWord + ', ' + bits.join('; ') + ' — each verdict is unpacked line by line below.' : '')
    + (op.options.length > 1 ? ' Shown for ' + recIns + ', the recommended option; the tables below compare every option.' : '');
  const sorted = [...rows].sort((a, c) => (a.d == null ? 1e12 : a.d) - (c.d == null ? 1e12 : c.d));
  const table = el('div', { class: 'cr-tw cr-hht' }, el('table', {},
    el('thead', {}, el('tr', {},
      el('th', {}, kindWord === 'policies' ? 'Policy' : 'Building'),
      el('th', {}, 'Current'), el('th', {}, 'Proposed'), el('th', {}, 'Δ / mo'), el('th', {}, 'Verdict'))),
    el('tbody', {},
      sorted.map(r => el('tr', {},
        el('td', { class: 'b' }, r.b.name),
        el('td', { class: 'val' }, el('span', { class: 'n' }, r.curKnown ? crMoney(r.cur) : '—')),
        el('td', { class: 'val' }, el('span', { class: 'n' }, crMoney(r.prop))),
        el('td', { class: 'val', style: r.d == null ? '' : r.d < -0.5 ? 'color:var(--green);font-weight:700' : r.d > 0.5 ? 'color:var(--red);font-weight:700' : '' },
          r.d == null ? '—' : (r.d > 0 ? '+' : '') + crMoney(r.d)),
        el('td', {}, crVdPill(r.verdict)))),
      el('tr', { class: 'tot' },
        el('td', { class: 'b' }, 'Portfolio'),
        el('td', { class: 'val' }, el('span', { class: 'n' }, anyCur ? crMoney(totCur) : '—')),
        el('td', { class: 'val' }, el('span', { class: 'n' }, crMoney(totProp))),
        el('td', { class: 'val', style: !anyCur ? '' : totD < -0.5 ? 'color:var(--green);font-weight:700' : totD > 0.5 ? 'color:var(--red);font-weight:700' : '' },
          anyCur ? (totD > 0 ? '+' : '') + crMoney(totD) : '—'),
        el('td', {})))));
  const legend = el('div', { class: 'cr-leg' },
    sw ? el('span', {}, crVdPill('switch'), ' cheaper — a straight saving') : null,
    upg ? el('span', {}, crVdPill('upgrade'), ' costs more — but buys stronger cover (see the detail)') : null,
    rv ? el('span', {}, crVdPill('review'), ' costs more with no clear cover gain — challenge the rate') : null,
    rows.some(r => r.verdict === 'confirm') ? el('span', {}, crVdPill('confirm'), ' current premium not read — confirm before presenting') : null);
  const hasSasria = withQuotes.some(b => optionQuotes(b).some(q => q.lines.some(l => /sasria/i.test(l.s))));
  const sasria = hasSasria ? el('div', { class: 'cr-sasria' },
    el('span', { class: 'sk' }, 'What is Sasria?'),
    el('p', { html: 'Sasria is government cover for riot, strike and public-disorder damage — a single national pool. <b>Every insurer charges the same Sasria rate</b> on the declared value, so where one column looks higher it is often the Sasria base moving with the sum insured, not the insurer’s own price.' })) : null;
  return el('div', { class: 'cr-hh' },
    el('div', { class: 'cr-eyerow' }, el('span', { class: 'k' }, 'Head-to-head'),
      el('h2', {}, crWordN(n) + ' ' + kindWord + ', one ' + (strong ? 'stronger ' : '') + 'programme'), el('span', { class: 'line' })),
    el('p', { class: 'lede2' }, lede),
    el('div', { class: 'cr-hhcards' }, ...cards),
    table, legend, sasria);
}

function screenReport() {
  const rm = RMS.find(r => r.id === state.rmId) || RMS[0];
  const op = optionPortfolio();
  const withQuotes = state.buildings.filter(b => optionQuotes(b).length);
  op.recId = crRecommendId(withQuotes, op.options) || op.recId;   // cover-first (upgrade, not downgrade)
  const findings = crCoverFindings(withQuotes);
  const rmView = state.reportView === 'rm';
  const today = new Date().toLocaleDateString('en-ZA', { day: 'numeric', month: 'long', year: 'numeric' });
  const up = crBiggestUpgrade(withQuotes);                      // biggest upgrade across all options (the banner)
  const recUp = crBiggestUpgrade(withQuotes, op.recId);        // the recommended option's OWN biggest upgrade
  // Portfolio jobs (2+ buildings) get the pack layout: cover story +
  // building-by-building head-to-head instead of the generic cards.
  const isPortfolio = withQuotes.length > 1;
  const insMap = isPortfolio ? crCurrentInsurers(withQuotes) : null;
  const hhRows = isPortfolio ? crPerBuilding(withQuotes, op) : null;
  // Portfolio hero facts: the saving and the rebuild value up front.
  const heroCur = isPortfolio ? hhRows.reduce((s, r) => s + (r.curKnown ? r.cur : 0), 0) : 0;
  const heroProp = isPortfolio ? hhRows.reduce((s, r) => s + r.prop, 0) : 0;
  const heroD = +(heroProp - heroCur).toFixed(2);
  const heroSi = isPortfolio ? withQuotes.reduce((s, b) => s + (parseLimit(b.si) || 0), 0) : 0;
  const chips = [
    state.buildings.length > 1 ? el('span', { class: 'cr-chip' }, 'Risks ', el('b', {}, String(withQuotes.length))) : null,
    op.options.length ? el('span', { class: 'cr-chip' }, 'Options ', el('b', {}, String(op.options.length))) : null,
    isPortfolio && hhRows.some(r => r.curKnown) && heroD < -0.5
      ? el('span', { class: 'cr-chip' }, 'Saving ', el('b', {}, crMoney(heroD) + '/mo')) : null,
    isPortfolio && heroSi ? el('span', { class: 'cr-chip' }, 'Rebuild value ', el('b', {}, crBigMoney(heroSi))) : null,
    state.client.renewal ? el('span', { class: 'cr-chip' }, 'Renews ', el('b', {}, state.client.renewal)) : null,
    el('span', { class: 'cr-chip' }, 'Prepared ', el('b', {}, today)),
  ].filter(Boolean);
  return el('div', {},
    el('div', { class: 'eyebrow' }, 'Step 03'),
    el('h1', { class: 'pg' }, 'Client report'),
    el('p', { class: 'lede' }, rmView
      ? 'RM working copy — the same comparison plus an internal findings & actions panel. Switch to the client view before you print for the client.'
      : 'A client-ready comparison — the per-line verdicts and the recommendation are generated automatically. Print to PDF from the button below; page furniture is stripped.'),
    el('div', { class: 'cr' + (rmView ? ' cr-rmmode' : '') },
      el('header', { class: 'cr-hero' },
        el('div', { class: 'cr-wm' },
          el('div', { class: 'logo', html: 'Cartrack <b>Insurance</b>' }),
          el('div', { class: 'ref' }, 'Commercial Division · FSP 17266', el('br'), 'Prepared by ' + rm.name)),
        el('div', { class: 'cr-eyebrow' }, 'Premium Comparison'),
        el('h1', {}, state.client.name || 'Premium comparison'),
        el('p', { class: 'lede' }, isPortfolio
          ? crWordN(withQuotes.length).toLowerCase() + ' ' + (policyKind() === 'motor' ? 'policies' : 'buildings')
            + ', compared line by line against ' + (op.options.length > 1 ? op.options.length + ' Cartrack options'
              : 'a single Cartrack-arranged programme' + (((op.options[0] || {}).insurer || '') && !/^cartrack$/i.test(op.options[0].insurer) ? ' with ' + op.options[0].insurer : ''))
            + ' — with a clear verdict on every section.'
          : 'Current cover measured against ' + (op.options.length > 1 ? op.options.length + ' market proposals' : 'the Cartrack proposal')
            + ' — line by line, with a clear verdict on every section.'),
        chips.length ? el('div', { class: 'cr-chips' }, ...chips) : null,
        isPortfolio && withQuotes.length <= 6 ? el('div', { class: 'cr-chips' },
          ...withQuotes.map(b => el('span', { class: 'cr-chip dim' }, crShortName(b.name)))) : null),
      el('div', { class: 'cr-b' },
        rmView ? crRmPanel(findings, crScheduleAudit()) : null,
        isPortfolio ? crExecSummary(op, hhRows, insMap) : null,
        isPortfolio ? (crCoverStory(withQuotes, op, hhRows, insMap, findings) || crVerdictCards(op)) : crVerdictCards(op),
        isPortfolio ? crHeadToHead(withQuotes, op, hhRows, insMap) : (op.options.length ? crSavingsChart(op) : null),
        up ? crAlert(up) : null,
        isPortfolio ? el('div', { class: 'cr-eyerow' }, el('span', { class: 'k' }, 'The evidence'),
          el('h2', {}, 'Line by line, ' + (policyKind() === 'motor' ? 'policy by policy' : 'building by building')), el('span', { class: 'line' })) : null,
        ...withQuotes.map((b, i) => crBuildingSection(b, optionQuotes(b), op.recId, i,
          isPortfolio ? hhRows.find(r => r.b.id === b.id) : null, insMap)),
        crWhyCartrack(),
        crReco(op, recUp, rm, findings, isPortfolio ? { rows: hhRows } : null),
        el('div', { class: 'cr-fine' },
          'Prepared by Cartrack Insurance Agency (Pty) Ltd (FSP 17266) for ' + (state.client.name || 'the client') + '. Figures are captured from insurer schedules and quotations and are subject to the terms, conditions and exclusions of the underlying policy documents, which prevail over this summary. E&OE. This is a premium comparison and does not itself constitute advice or an offer of cover.',
          el('div', { class: 'cr-dctl' },
            el('span', {}, 'Confidential · Premium Comparison · ' + (state.client.name || '')),
            el('span', {}, 'Prepared ' + today + ' · ' + rm.name + ' · ' + APP_VERSION))))),
    el('div', { class: 'printhint no-print' }, 'Tip — iPhone: use the Share button → Options → PDF instead of Print (Print stamps the browser’s URL header on every page). Desktop Chrome: untick “Headers and footers” in the print dialog.'),
    el('div', { class: 'bar no-print' }, el('div', { class: 'bar-in' },
      el('button', { class: 'btn', onClick: () => go('review') }, '← Review'),
      el('div', { class: 'viewtog', role: 'group', 'aria-label': 'Report view' },
        el('button', { class: 'vt' + (!rmView ? ' on' : ''), onClick: () => { state.reportView = 'client'; save(); render(); } }, 'Client view'),
        el('button', { class: 'vt' + (rmView ? ' on' : ''), onClick: () => { state.reportView = 'rm'; save(); render(); } }, 'RM view')),
      el('div', { style: 'flex:1' }),
      el('button', { class: 'btn', onClick: sendToBook }, 'Send to RM book →'),
      el('button', { class: 'btn primary', onClick: () => window.print() }, rmView ? 'Print RM copy' : 'Print / save as PDF'),
    )),
  );
}

/* ---------- Router ---------- */
/* ---------- welcome gate: pick your name ---------- */
const WELCOME_QUOTES = [
  ["You don't close a sale; you open a relationship.","Patricia Fripp"],
  ["Make a customer, not a sale.","Katherine Barchetti"],
  ["Stop selling. Start helping.","Zig Ziglar"],
  ["The harder you work, the luckier you get.","Gary Player"],
  ["People don't buy for logical reasons. They buy for emotional reasons.","Zig Ziglar"],
  ["If you are not taking care of your customer, your competitor will.","Bob Hooey"],
  ["Approach each customer with the idea of helping them solve a problem.","Brian Tracy"],
  ["Success is the sum of small efforts, repeated day in and day out.","Robert Collier"],
  ["Your attitude, not your aptitude, will determine your altitude.","Zig Ziglar"],
  ["Great things never came from comfort zones.","Anonymous"],
  ["Opportunities don't happen. You create them.","Chris Grosser"],
  ["The best way to predict the future is to create it.","Peter Drucker"],
];
const WELCOME_LINES = [
  "Let's find them a better deal than what they've got.",
  "Time to sharpen the numbers.",
  "Build it clean — the comparison sells itself.",
  "Every gap you spot is a client you keep.",
  "Make the proposal impossible to say no to.",
  "Show them exactly why Cartrack wins.",
];
function greetWord(){ const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; }
function screenWelcome(){
  const dayN=Math.floor(new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()).getTime()/864e5);
  const [qt,qb]=WELCOME_QUOTES[((dayN % WELCOME_QUOTES.length)+WELCOME_QUOTES.length)%WELCOME_QUOTES.length];
  const grid = el('div',{class:'rm-grid'},
    RMS.map((r,i)=> el('button',{class:'rm-tile', style:`animation-delay:${(0.04*i+0.05).toFixed(2)}s`, onClick:()=>pickRm(r.id)},
      el('div',{class:'av'}, r.initials),
      el('div',{},
        el('div',{class:'nm'}, r.name),
        el('div',{class:'rl'}, r.role)),
      el('span',{class:'arr'},'→')
    ))
  );
  return el('div',{class:'welcome'},
    el('div',{class:'wel-top'},
      el('div',{class:'b'}, 'CARTRACK ', el('span',{},'INSURANCE')),
      el('span',{class:'appver', title:'App version — quote this to support'}, APP_VERSION),
      el('a',{class:'home-link', href:'https://cartrack-commercial.github.io/', title:'Back to the launcher'}, '← Home')),
    el('div',{class:'wel-body'},
      el('div',{class:'wel-kick'}, greetWord()+' — Commercial team'),
      el('h1',{class:'wel-h', html:'Who’s comparing <span class="accent">today?</span>'}),
      el('p',{class:'wel-sub'}, 'Tap your name to start a fresh comparison. Everything you load stays on this device only.'),
      PENDING_DRAFT ? (() => {
        const d = PENDING_DRAFT, n = d.state.files.schedule.length + d.state.files.quote.length;
        const age = Math.max(1, Math.round((Date.now() - d.ts) / 6e4));
        const when = age < 60 ? age + ' min ago' : age < 1440 ? Math.round(age / 60) + ' h ago' : Math.round(age / 1440) + ' d ago';
        const rm = RMS.find(r => r.id === d.state.rmId);
        return el('div', { class: 'draftbar' },
          el('div', { class: 'dtxt' },
            el('b', {}, 'Resume where you left off?'),
            el('div', { class: 'ds' }, (d.state.client.name || 'Comparison in progress') + ' · ' + n + ' file' + (n === 1 ? '' : 's')
              + (rm ? ' · ' + rm.name : '') + ' · saved ' + when + ' — stays on this device')),
          el('div', { class: 'da' },
            el('button', { class: 'btn primary sm', onClick: () => { state = d.state; PENDING_DRAFT = null; save(); render(); } }, 'Resume'),
            el('button', { class: 'btn sm', onClick: () => { clearDraft(); render(); } }, 'Discard')));
      })() : null,
      grid,
      el('div',{class:'wel-quote'},
        el('div',{class:'ql'}, 'Fuel for the day'),
        el('blockquote',{}, '“'+qt+'”'),
        el('div',{class:'qby'}, '— '+qb))
    )
  );
}
function pickRm(id){
  const rm = RMS.find(r=>r.id===id) || RMS[0];
  state.rmId = id; state.rmChosen = true; state.step='upload'; save();
  const first = String(rm.name).split('/')[0];
  const line = WELCOME_LINES[Math.floor(Math.random()*WELCOME_LINES.length)];
  const flash = el('div',{class:'wel-flash'},
    el('div',{class:'fav'}, rm.initials),
    el('div',{class:'fh'}, 'You’re up, '+first+'!'),
    el('div',{class:'fs'}, line));
  document.body.append(flash);
  setTimeout(()=>{ flash.remove(); render(); }, 1300);
}

function render() {
  const mast = document.querySelector('.masthead');
  if (!state.rmChosen) {
    if (mast) mast.style.display = 'none';
    const app = $('#app'); app.innerHTML = ''; app.append(screenWelcome());
    return;
  }
  if (mast) mast.style.display = '';
  renderHeader();
  const app = $('#app'); app.innerHTML = '';
  if (state.step === 'upload') app.append(screenUpload());
  else if (state.step === 'review') app.append(screenReview());
  else app.append(screenReport());
}
render();

/* Guard against losing an in-progress comparison to an accidental tab close.
   We deliberately do NOT persist client data to disk (privacy) — sessionStorage
   already survives a refresh; this just warns before the tab is closed. */
window.addEventListener('beforeunload', (e) => {
  const busy = state.rmChosen && (((state.files?.schedule?.length || 0) + (state.files?.quote?.length || 0)) > 0 || (state.buildings?.length || 0) > 0);
  if (busy) { e.preventDefault(); e.returnValue = ''; }
});

/* Installable PWA */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
