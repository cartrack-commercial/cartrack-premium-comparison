<!-- Cartrack Insurance Compliance Design System — token layer only (plain CSS custom properties) -->
<link rel="stylesheet" href="_ds/cartrack-insurance-compliance-design-sys-6fdc1bd8-d4b3-4d41-9483-367d24521aed/tokens/fonts.css">
<link rel="stylesheet" href="_ds/cartrack-insurance-compliance-design-sys-6fdc1bd8-d4b3-4d41-9483-367d24521aed/tokens/colors.css">
<link rel="stylesheet" href="_ds/cartrack-insurance-compliance-design-sys-6fdc1bd8-d4b3-4d41-9483-367d24521aed/tokens/typography.css">
<link rel="stylesheet" href="_ds/cartrack-insurance-compliance-design-sys-6fdc1bd8-d4b3-4d41-9483-367d24521aed/tokens/layout.css">
<link rel="stylesheet" href="_ds/cartrack-insurance-compliance-design-sys-6fdc1bd8-d4b3-4d41-9483-367d24521aed/tokens/base.css">

<style>
  :root { --maxw: 1120px; --font-head: "Saira", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    /* professional refresh: pure-white canvas, softer hairlines (override design-system tokens) */
    --color-canvas: #FFFFFF; --hairline: #E7EAEF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-canvas, #FFFFFF); color: var(--color-text, #14161B);
    font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  h1, h2, h3, .head { font-family: var(--font-head); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }

  /* ---- Masthead ---- */
  .masthead { background: var(--color-surface-inverse, #0B0C0F); color: #fff;
    padding: 12px max(16px, env(safe-area-inset-left)); display: flex; align-items: center;
    gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { height: 26px; width: auto; display: block; }
  .brand .name { font-family: var(--font-head); font-weight: 800; letter-spacing: .02em;
    font-size: 15px; line-height: 1; }
  .brand .name small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .18em;
    color: var(--orange-400, #F58C4F); margin-top: 3px; }
  .steps { display: flex; gap: 4px; margin-left: 8px; flex-wrap: wrap; }
  .step { display: flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 6px;
    font-size: 12px; color: var(--ink-300, #A8AFBC); cursor: pointer; border: 1px solid transparent;
    background: transparent; }
  .step[aria-current="true"] { color: #fff; background: rgba(255,255,255,.06);
    border-color: rgba(255,255,255,.12); }
  .step .n { font-family: var(--font-mono); font-size: 11px; padding: 1px 5px; border-radius: 4px;
    background: rgba(255,255,255,.1); }
  .step[aria-current="true"] .n { background: var(--orange-500, #F47735); color: #fff; }
  .spacer { flex: 1 1 auto; }
  .home-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-300,#A8AFBC); text-decoration: none; border: 1px solid rgba(255,255,255,.15);
    padding: 7px 12px; border-radius: 8px; white-space: nowrap; transition: color .15s, border-color .15s; }
  .home-link:hover, .home-link:focus-visible { color: #fff; border-color: var(--orange-500,#F47735); outline: none; }
  .rm { display: flex; align-items: center; gap: 9px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 5px 10px; }
  .rm .av { width: 30px; height: 30px; border-radius: 50%; background: var(--orange-500,#F47735);
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-family: var(--font-head); font-size: 12px; }
  .rm select { background: transparent; color: #fff; border: none; font-family: var(--font-head);
    font-weight: 700; font-size: 13px; outline: none; }
  .rm select option { color: #14161B; }
  .rm .role { font-size: 10px; color: var(--ink-300,#A8AFBC); }

  /* ---- Page ---- */
  main { max-width: var(--maxw); margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)) 64px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    color: var(--color-accent, #F47735); }
  h1 { font-size: 30px; font-weight: 800; margin: 6px 0 10px; }
  .lede { color: var(--color-text-muted, #5E6675); max-width: 680px; margin: 0 0 24px; }

  .card { background: var(--color-surface, #fff); border: 1px solid var(--hairline, #E7EAEF);
    border-radius: 12px; box-shadow: 0 1px 2px rgba(11,12,15,.05), 0 2px 8px rgba(11,12,15,.04); }
  .card + .card { margin-top: 20px; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--color-divider, #DFE3E9); flex-wrap: wrap; }
  .card-h h2 { font-size: 14px; font-weight: 800; letter-spacing: .01em; margin: 0; display: flex; align-items: center; gap: 8px; color: var(--color-text, #0B0C0F); }
  .card-h h2::before { content: ""; width: 14px; height: 2px; background: var(--color-accent, #F47735); border-radius: 2px; flex: none; }
  .card-h .n { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-subtle,#7C8492); }
  .card-b { padding: 18px; }
  .muted { color: var(--color-text-muted, #5E6675); }

  label.field { display: block; }
  label.field .lab { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--color-text-muted, #5E6675); margin-bottom: 6px; }
  input, select.inp, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--color-border, #CDD2DB);
    border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff; color: inherit; }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, select.inp:focus, textarea:focus { outline: 2px solid var(--color-focus-ring, #F47735);
    outline-offset: 1px; border-color: var(--color-accent, #F47735); }
  input.sm { padding: 7px 9px; font-size: 13px; }
  input.money { font-family: var(--font-mono); text-align: right; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  .dropzone { border: 1.5px dashed var(--color-border-strong, #A8AFBC); border-radius: 10px;
    padding: 26px 18px; text-align: center; cursor: pointer; background: var(--ink-25, #FAFBFC);
    transition: border-color .15s, background .15s; }
  .dropzone:hover, .dropzone.drag { border-color: var(--color-accent, #F47735); background: var(--orange-50,#FEF4EC); }
  .dropzone .big { font-weight: 700; }
  .dropzone .sub { font-size: 12px; color: var(--color-text-subtle,#7C8492); margin-top: 4px; }

  .file { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 1px solid var(--color-border,#CDD2DB);
    border-radius: 9px; margin-bottom: 10px; background: #fff; }
  .file .kind { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: #fff;
    padding: 3px 6px; border-radius: 4px; }
  .file .kind.PDF { background: var(--red-600,#BE3A30); }
  .file .kind.XLSX { background: var(--green-700,#166B46); }
  .file .meta { flex: 1 1 auto; min-width: 0; }
  .file .meta .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .meta .st { font-size: 11px; color: var(--color-text-subtle,#7C8492); margin-top: 2px; }
  .file .x { border: none; background: transparent; cursor: pointer; color: var(--color-text-subtle,#7C8492);
    font-size: 18px; line-height: 1; padding: 4px; border-radius: 6px; }
  .file .x:hover { background: var(--red-100,#FBE9E7); color: var(--red-600,#BE3A30); }
  .pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .pill.ok, .pill.saving, .pill.added { background: var(--green-100,#E6F3EC); color: var(--green-700,#166B46); }
  .pill.busy { background: var(--blue-100,#E8EEF9); color: var(--blue-700,#21437F); }
  .pill.err, .pill.gap { background: var(--red-100,#FBE9E7); color: var(--red-700,#98271F); }
  .pill.increase { background: var(--amber-100,#FAF0D9); color: var(--amber-700,#8A610C); }
  .pill.matched { background: var(--ink-100,#ECEEF2); color: var(--ink-600,#454C58); }

  .bar { position: sticky; bottom: 0; background: color-mix(in srgb, var(--color-canvas,#F4F6F8) 92%, transparent);
    backdrop-filter: blur(6px); border-top: 1px solid var(--color-border,#CDD2DB); padding: 12px 0;
    margin: 28px calc(-1 * max(16px, env(safe-area-inset-left))) 0; }
  .bar-in { max-width: var(--maxw); margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left));
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn { padding: 11px 18px; border-radius: 9px; font-weight: 700; font-size: 14px; cursor: pointer;
    border: 1px solid var(--color-border,#CDD2DB); background: #fff; color: var(--color-text,#14161B); }
  .btn.primary { background: var(--color-accent,#F47735); border-color: var(--color-accent,#F47735); color: #fff; }
  .btn.primary:hover { background: var(--color-accent-hover,#E2631C); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.sm { padding: 7px 12px; font-size: 12px; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--red-600,#BE3A30); }

  .note { font-size: 12px; color: var(--color-text-muted,#5E6675); display: flex; gap: 8px; align-items: flex-start; }
  .note .dot { color: var(--color-accent,#F47735); font-weight: 800; }

  /* ---- Review: rollup ---- */
  .rollup { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .stat { background: var(--color-surface,#fff); border: 1px solid var(--color-border,#CDD2DB);
    border-radius: 12px; padding: 14px 16px; }
  .stat .lab { font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
    color: var(--color-text-subtle,#7C8492); margin-bottom: 5px; }
  .stat .val { font-family: var(--font-mono); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 11px; color: var(--color-text-subtle,#7C8492); margin-top: 3px; }

  /* ---- Review: building / quote ---- */
  .bmeta { display: grid; grid-template-columns: 2fr 1.4fr 2fr 1fr; gap: 10px; }
  .qtabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .qtab { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--color-border,#CDD2DB);
    background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
  .qtab[aria-current="true"] { background: var(--ink-950,#0B0C0F); color: #fff; border-color: var(--ink-950,#0B0C0F); }
  .qmeta { display: grid; grid-template-columns: 1.6fr 1fr 1.4fr auto; gap: 10px; align-items: end; }

  /* line grid: section | cur limit | cur R | prop limit | prop R | delta | status | x */
  .lines { border: 1px solid var(--color-border,#CDD2DB); border-radius: 10px; overflow: hidden; margin-top: 14px; }
  .lrow { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr .9fr .8fr 34px;
    gap: 0; align-items: center; border-bottom: 1px solid var(--color-divider,#DFE3E9); background: #fff; }
  .lrow:last-child { border-bottom: none; }
  .lrow > div { padding: 7px 8px; min-width: 0; }
  .lrow.lhead { background: var(--color-surface-sunken,#ECEEF2); font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-600,#454C58); }
  .lrow input { border-color: transparent; background: transparent; padding: 6px 7px; font-size: 13px; border-radius: 6px; }
  .lrow input:hover { border-color: var(--color-border,#CDD2DB); background: #fff; }
  .lrow input:focus { background: #fff; }
  .lrow .delta { font-family: var(--font-mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .lrow .delta.neg { color: var(--green-700,#166B46); }
  .lrow .delta.pos { color: var(--red-600,#BE3A30); }
  .lrow .xc { text-align: center; }
  .lrow .lab-m { display: none; }
  .ltogs { display: flex; gap: 4px; margin-top: 3px; padding: 0 7px; }
  .ltoggle { font-size: 9px; font-weight: 700; letter-spacing: .02em; padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--color-border,#CDD2DB); background: #fff; color: var(--ink-400,#7C8492); cursor: pointer; }
  .ltoggle.on { background: var(--orange-500,#F47735); border-color: var(--orange-500,#F47735); color: #fff; }
  .lchips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 7px 0; }
  .lchip { display: inline-flex; align-items: center; font-size: 9.5px; font-weight: 700; line-height: 1.3;
    padding: 1px 6px; border-radius: 4px; border: 1px solid; }
  .lchip.err { background: var(--red-100,#FBE9E7); color: var(--red-700,#98271F); border-color: var(--red-200,#f3c9c4); }
  .lchip.increase { background: var(--amber-100,#FAF0D9); color: var(--amber-700,#8A610C); border-color: #ecdba8; }
  .lchip.saving { background: var(--green-100,#E6F3EC); color: var(--green-700,#166B46); border-color: #bfe3cf; }
  .ltotal { display: flex; justify-content: flex-end; gap: 26px; padding: 10px 14px;
    background: var(--ink-25,#FAFBFC); border-top: 1px solid var(--color-divider,#DFE3E9);
    font-family: var(--font-mono); font-size: 13px; flex-wrap: wrap; }
  .ltotal b { font-weight: 600; }

  details.src { border: 1px solid var(--color-border,#CDD2DB); border-radius: 10px; background: #fff;
    padding: 0; margin-bottom: 10px; }
  details.src summary { cursor: pointer; padding: 11px 14px; font-weight: 600; font-size: 13px; }
  details.src pre { margin: 0; padding: 12px 14px; border-top: 1px solid var(--color-divider,#DFE3E9);
    max-height: 260px; overflow: auto; font-family: var(--font-mono); font-size: 11px;
    white-space: pre-wrap; word-break: break-word; background: var(--ink-25,#FAFBFC); }

  .placeholder-screen { text-align: center; padding: 60px 20px; color: var(--color-text-muted,#5E6675); }
  .placeholder-screen h2 { font-size: 20px; color: var(--color-text,#14161B); }

  /* ---- Report ---- */
  .sheet { background: #fff; border: 1px solid var(--hairline,#E7EAEF); border-radius: 8px;
    max-width: 820px; margin: 0 auto; padding: 0; overflow: hidden; box-shadow: 0 2px 12px rgba(11,12,15,.06); }
  .rhead { } /* branded cover — kept together on the first page in print */
  .sheet-mast { background: var(--ink-950,#0B0C0F); color: #fff; padding: 17px 34px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .sheet-mast img { height: 26px; }
  .sheet-mast .doc { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--orange-500,#F47735); text-align: right; line-height: 1.6; }
  .sheet-mast .doc .d2 { color: var(--ink-300,#A8AFBC); }
  .rband { height: 4px; background: linear-gradient(90deg, var(--orange-hi,#FF8A47), var(--orange-600,#E2631C)); }
  .rcover { padding: 24px 34px 6px; }
  .rcover .pf { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; letter-spacing: .2em;
    text-transform: uppercase; color: var(--orange-600,#E2631C); margin: 0 0 7px; }
  .rcover h1.rt { font-family: var(--font-head); font-weight: 800; font-size: 30px; line-height: 1.04;
    letter-spacing: -.015em; margin: 0 0 8px; color: var(--ink-950,#0B0C0F); }
  .rcover .rsub { font-size: 12px; color: var(--color-text-muted,#5E6675); margin: 0; }
  .sheet-b { padding: 16px 34px 34px; }
  .sheet h2.rt { font-size: 22px; margin: 0 0 2px; }
  .rtable { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 4px; }
  .rtable th { text-align: left; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-600,#454C58); background: var(--ink-100,#ECEEF2); padding: 7px 9px;
    border: 1px solid var(--ink-150,#DFE3E9); }
  .rtable td { padding: 7px 9px; border: 1px solid var(--ink-150,#DFE3E9); vertical-align: top; }
  .rtable td.r, .rtable th.r { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rtable tr.tot td { background: var(--ink-25,#FAFBFC); font-weight: 700; }
  .rneg { color: var(--green-700,#166B46); } .rpos { color: var(--red-600,#BE3A30); }
  /* ---- multi-option comparison ---- */
  .rscroll { overflow-x: auto; margin: 8px 0 4px; }
  .rtable th.opt { text-align: right; }
  .rtable th.opt .oi { display: block; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--ink-800,#1E222A); font-weight: 700; }
  .rtable th.rec, .rtable td.best { background: var(--orange-50,#FEF4EC); }
  .rtable th.rec { box-shadow: inset 0 3px 0 var(--orange-500,#F47735); }
  .rtable td.best { color: var(--green-700,#166B46); font-weight: 700; }
  .rtable td.best .btick { color: var(--green-700,#166B46); font-weight: 700; }
  .rtable td.gapc { color: var(--red-600,#BE3A30); }
  .recbadge { display: inline-block; font-size: 8px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    background: var(--orange-500,#F47735); color: #fff; padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; }
  .savechip { display: block; font-size: 9.5px; font-weight: 600; margin-top: 1px; }
  /* ---- Review: side-by-side editable comparison table ---- */
  .rvtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rvtable th { text-align: left; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-600,#454C58); background: var(--ink-100,#ECEEF2); padding: 6px 8px; border: 1px solid var(--hairline,#E7EAEF); vertical-align: middle; }
  .rvtable th.r { text-align: right; }
  .rvtable td { padding: 2px 5px; border: 1px solid var(--hairline,#E7EAEF); vertical-align: middle; }
  .rvtable td.r { text-align: right; }
  .rvtable tr.tot td { background: var(--ink-25,#FAFBFC); font-weight: 700; padding: 8px; }
  .rvtable td.best { background: var(--orange-50,#FEF4EC); color: var(--green-700,#166B46); }
  .rvin { width: 100%; border: 1px solid var(--color-border,#CDD2DB); background: #fff; font: inherit; padding: 6px 8px; border-radius: 6px; box-sizing: border-box; }
  .rvin:hover { border-color: var(--color-text-subtle,#7C8492); }
  .rvin:focus { outline: none; border-color: var(--color-accent,#F47735); box-shadow: 0 0 0 2px rgba(244,119,53,.18); }
  .rvin.r { text-align: right; font-family: var(--font-mono); }
  .rvin::placeholder { color: var(--ink-300,#A8AFBC); }
  .rvname { border: 1px solid transparent; background: transparent; font: inherit; font-weight: 800; color: inherit; padding: 2px 5px; border-radius: 6px; min-width: 130px; }
  .rvname:hover { border-color: rgba(255,255,255,.25); } .rvname:focus { outline: none; border-color: var(--color-accent,#F47735); }
  .optcards { display: grid; gap: 10px; margin: 4px 0 20px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .optcard { border: 1px solid var(--ink-150,#DFE3E9); border-radius: 8px; padding: 11px 13px; position: relative; }
  .optcard.rec { border-color: var(--orange-500,#F47735); box-shadow: inset 0 3px 0 var(--orange-500,#F47735); }
  .optcard .oi { font-family: var(--font-head); font-weight: 700; font-size: 13px; }
  .optcard .ov { font-family: var(--font-mono); font-size: 17px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .optcard .os { font-size: 10px; color: var(--ink-500,#5E6675); margin-top: 2px; }
  .sheet h3 { font-size: 13px; margin: 24px 0 4px; }
  .sheet .badv { margin: 6px 0 0; padding-left: 18px; font-size: 11.5px; color: var(--ink-700,#2F343D); }
  .sheet .badv li { margin-bottom: 3px; }
  .sig { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--ink-150,#DFE3E9);
    display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; font-size: 11.5px; }
  .sig .who b { display: block; font-size: 13px; }
  .sig .who span { color: var(--color-text-muted,#5E6675); }
  .fineprint { margin-top: 14px; font-size: 9.5px; color: var(--ink-400,#7C8492); line-height: 1.5; }

  /* ---- Responsive: full parity ---- */
  @media (max-width: 860px) {
    .bmeta, .qmeta { grid-template-columns: 1fr 1fr; }
    .rollup { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    h1 { font-size: 24px; }
    .grid3 { grid-template-columns: 1fr; }
    .panels { grid-template-columns: 1fr; }
    .steps { order: 3; width: 100%; }
    .masthead { gap: 10px; }
    .bmeta, .qmeta { grid-template-columns: 1fr; }
    /* line rows become stacked cards with labels */
    .lrow { grid-template-columns: 1fr 1fr; padding: 8px 6px; gap: 2px 8px; }
    .lrow.lhead { display: none; }
    .lrow > div { padding: 3px 6px; }
    .lrow .c-sec { grid-column: 1 / -1; }
    .lrow .lab-m { display: block; font-size: 9px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--ink-400,#7C8492); margin-bottom: 1px; }
    .lrow .xc { grid-column: 2; text-align: right; }
  }

  /* ---- Client-report hero summary ---- */
  .rhero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin: 6px 0 22px; align-items: stretch; }
  .rhero .rsave { border-radius: 10px; padding: 18px 20px; color: #fff;
    background: linear-gradient(135deg, #13151A, #2F343D); display: flex; flex-direction: column; justify-content: center; }
  .rhero .rsave.pos { background: linear-gradient(135deg, #0B0C0F, #2F343D); }
  .rhero .rsave .lbl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--orange-hi,#FF8A47); margin-bottom: 4px; }
  .rhero .rsave .big { font-family: var(--font-head); font-weight: 800; font-size: 30px; line-height: 1.02; letter-spacing: -.01em; }
  .rhero .rsave .sml { font-size: 11.5px; color: rgba(255,255,255,.72); margin-top: 5px; }
  .rhero .rpair { display: grid; grid-template-rows: 1fr 1fr; gap: 10px; }
  .rhero .rcell { border: 1px solid var(--hairline,#E7EAEF); border-radius: 10px; padding: 11px 15px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .rhero .rcell .k { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-500,#5E6675); }
  .rhero .rcell .v { font-family: var(--font-mono); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  @media (max-width: 620px) { .rhero { grid-template-columns: 1fr; } }

  /* ---- Print: the report sheet only ---- */
  @media print {
    @page { size: A4; margin: 11mm; }
    body { background: #fff; }
    .masthead, .bar, .no-print, .eyebrow, h1.pg, .lede { display: none !important; }
    main { padding: 0; max-width: none; }
    .sheet { border: none; max-width: none; border-radius: 0; box-shadow: none; }
    * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    /* keep the branded cover + summary together, and never orphan a heading from its table */
    .rhead { break-inside: avoid; break-after: avoid; }
    .rhero, .rnote, .rsummary { break-inside: avoid; }
    .sheet h3 { break-after: avoid; }
    .rtable { break-inside: auto; }
    .rtable tr, .rtable thead { break-inside: avoid; }
    .sig { break-inside: avoid; }
  }

  /* Report headline summary + rationale */
  .rsummary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 4px 0 20px; }
  .rfig { border: 1px solid var(--ink-150,#DFE3E9); border-radius: 6px; padding: 11px 13px; }
  .rfig .l { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-500,#5E6675); }
  .rfig .v { font-family: var(--font-mono); font-size: 19px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .rfig .s { font-size: 10.5px; color: var(--ink-500,#5E6675); margin-top: 2px; }
  .rnote { border-left: 3px solid var(--orange-500,#F47735); background: var(--orange-50,#FEF4EC);
    padding: 12px 15px; border-radius: 0 6px 6px 0; margin: 0 0 22px; }
  .rnote h3 { margin: 0 0 5px; font-size: 12px; }
  .rnote p { margin: 0 0 6px; font-size: 11.5px; line-height: 1.55; color: var(--ink-800,#1E222A); }
  .rnote ul { margin: 6px 0 0; padding-left: 18px; font-size: 11.5px; color: var(--ink-800,#1E222A); }
  .rnote li { margin-bottom: 3px; }
  @media (max-width: 640px) { .rsummary { grid-template-columns: 1fr; } }

  /* ---------- welcome / pick-your-name gate ---------- */
  .welcome { min-height: 100vh; background:
      radial-gradient(760px 380px at 88% -12%, rgba(244,119,53,.10), transparent 62%),
      radial-gradient(560px 320px at -8% 116%, rgba(244,119,53,.05), transparent 60%), #FFFFFF;
    display: flex; flex-direction: column; }
  .wel-top { background:#000; color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; }
  .wel-top .b { font-family: var(--font-head); font-weight:800; font-size:16px; letter-spacing:.02em; }
  .wel-top .b span { color: var(--orange-500,#F47735); }
  .wel-top .meta { font-family: var(--font-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:#A8AFBC; text-align:right; }
  .wel-body { flex:1; max-width: 860px; width:100%; margin:0 auto; padding: 34px 22px 48px; }
  .wel-kick { display:flex; align-items:center; gap:10px; font-family: var(--font-mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color: var(--orange-600,#E2631C); margin:0 0 12px; }
  .wel-kick::before { content:""; width:26px; height:2px; background: var(--orange-500,#F47735); }
  .wel-h { font-family: var(--font-head); font-weight:900; font-size: clamp(30px,6vw,46px); line-height:1.02; letter-spacing:-.015em; text-transform:uppercase; margin:0 0 8px; color:#0B0C0F; }
  .wel-h .accent { color: var(--orange-500,#F47735); }
  .wel-sub { font-size:14.5px; color: var(--ink-500,#5E6675); margin:0 0 26px; max-width:560px; }
  .rm-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:14px; }
  .rm-tile { position:relative; overflow:hidden; background:#fff; border:1px solid #E7EAEF; border-radius:14px; padding:20px 16px 18px;
    text-align:left; cursor:pointer; font-family:inherit; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    box-shadow: 0 1px 2px rgba(11,12,15,.05), 0 2px 8px rgba(11,12,15,.04); display:flex; flex-direction:column; gap:12px; }
  .rm-tile::after { content:""; position:absolute; left:0; right:0; top:0; height:3px; background: linear-gradient(90deg, #FF8A47, #E2631C); transform: scaleX(0); transform-origin:left; transition: transform .2s ease; }
  .rm-tile:hover, .rm-tile:focus-visible { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(11,12,15,.13); border-color: var(--orange-500,#F47735); outline:none; }
  .rm-tile:hover::after, .rm-tile:focus-visible::after { transform: scaleX(1); }
  .rm-tile .av { width:52px; height:52px; border-radius:14px; background: linear-gradient(135deg,#FF8A47,#E2631C); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family: var(--font-head); font-weight:800; font-size:20px; box-shadow: 0 4px 12px rgba(226,99,28,.28); }
  .rm-tile .nm { font-family: var(--font-head); font-weight:800; font-size:17px; letter-spacing:.01em; color:#0B0C0F; }
  .rm-tile .rl { font-size:11px; color: var(--ink-500,#5E6675); margin-top:2px; }
  .rm-tile .arr { position:absolute; right:14px; bottom:14px; color:#CDD2DB; font-weight:800; transition: color .16s, transform .16s; }
  .rm-tile:hover .arr { color: var(--orange-500,#F47735); transform: translateX(3px); }
  .wel-quote { margin-top:30px; border-left:4px solid var(--orange-500,#F47735); background:#FAFBFC; border-radius:0 10px 10px 0; padding:16px 20px; }
  .wel-quote .ql { font-family: var(--font-mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color: var(--orange-600,#E2631C); margin:0 0 6px; }
  .wel-quote blockquote { margin:0; font-size:15px; font-style:italic; font-weight:600; color:#1E222A; line-height:1.45; }
  .wel-quote .qby { margin-top:6px; font-family: var(--font-head); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color: var(--ink-500,#5E6675); }
  /* selection flash */
  .wel-flash { position:fixed; inset:0; z-index:200; background:#0B0C0F; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:24px;
    animation: flashIn .25s ease; }
  .wel-flash .fav { width:76px; height:76px; border-radius:20px; background: linear-gradient(135deg,#FF8A47,#E2631C); display:flex; align-items:center; justify-content:center; font-family: var(--font-head); font-weight:800; font-size:30px; box-shadow:0 10px 30px rgba(226,99,28,.4); animation: pop .4s cubic-bezier(.2,1.3,.4,1); }
  .wel-flash .fh { font-family: var(--font-head); font-weight:900; font-size:30px; text-transform:uppercase; letter-spacing:-.01em; margin-top:8px; }
  .wel-flash .fs { font-size:13.5px; color:#A8AFBC; max-width:300px; }
  @keyframes flashIn { from { opacity:0; } to { opacity:1; } }
  @keyframes pop { 0% { transform: scale(.4); opacity:0; } 100% { transform: scale(1); opacity:1; } }
  @media (prefers-reduced-motion: no-preference) {
    .rm-tile { opacity:0; transform: translateY(12px); animation: rmUp .5s ease forwards; }
    @keyframes rmUp { to { opacity:1; transform:none; } }
  }
  /* ============================================================
     MAGIC CLIENT REPORT — branded, auto-verdict comparison.
     Space Grotesk + Space Mono + Libre Franklin, embedded so it renders and prints
     identically anywhere. Scoped under .cr so the rest of the app
     (Saira / IBM Plex) is untouched.
     ============================================================ */
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url('assets/fonts/spacegrotesk-500.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:swap;src:url('assets/fonts/spacegrotesk-700.woff2') format('woff2');}
  @font-face{font-family:'Space Mono';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/spacemono-400.woff2') format('woff2');}
  @font-face{font-family:'Space Mono';font-style:normal;font-weight:700;font-display:swap;src:url('assets/fonts/spacemono-700.woff2') format('woff2');}
  @font-face{font-family:'Libre Franklin';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/librefranklin-400.woff2') format('woff2');}
  @font-face{font-family:'Libre Franklin';font-style:normal;font-weight:600;font-display:swap;src:url('assets/fonts/librefranklin-600.woff2') format('woff2');}
  @font-face{font-family:'Libre Franklin';font-style:normal;font-weight:700;font-display:swap;src:url('assets/fonts/librefranklin-700.woff2') format('woff2');}

  .cr{ --ink:#101215; --ink-2:#39404A; --muted:#6E7681; --paper:#FBFAF8; --card:#FFFFFF;
    --line:#EAE6DF; --line-2:#F2EFEA; --panel:#14161C; --orange:#F4772E; --orange-hi:#FF9A5A;
    --orange-deep:#CE5C16; --green:#12936A; --green-bg:#E7F4EE; --red:#D8443C; --red-bg:#FBEAE8;
    --blue:#2C6BB3; --blue-bg:#E8EFF7;
    font-family:'Libre Franklin','Segoe UI',system-ui,-apple-system,sans-serif; color:var(--ink);
    background:var(--paper); border-radius:14px; overflow:hidden; }
  .cr .num{font-family:'Libre Franklin',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:0;}
  .cr h1,.cr h2,.cr h3,.cr-hero h1,.cr-qc h3,.cr-sh h2,.cr-eyerow h2,.cr-chart .ct,.cr-alert .at{font-family:'Space Grotesk','Libre Franklin',sans-serif;letter-spacing:-.01em;}

  /* hero */
  .cr-hero{position:relative;background:var(--panel);color:#fff;padding:32px 34px 34px;overflow:hidden;}
  .cr-hero::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(720px 360px at 88% -20%,rgba(244,119,46,.42),transparent 62%),radial-gradient(500px 300px at 4% 128%,rgba(244,119,46,.12),transparent 60%);}
  .cr-hero>*{position:relative;z-index:1;}
  .cr-wm{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;}
  .cr-wm .logo{font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;}
  .cr-wm .logo b{color:var(--orange-hi);}
  .cr-wm .ref{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;color:#8B93A0;text-align:right;line-height:1.7;}
  .cr-eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange-hi);margin-bottom:13px;}
  .cr-eyebrow::before{content:"";width:24px;height:2px;background:var(--orange);}
  /* color set EXPLICITLY: without it the h1 computes near-black despite the
     hero's white color (rendering quirk) — invisible on the dark panel. */
  .cr-hero h1{font-weight:700;font-size:clamp(26px,4.4vw,40px);line-height:1.03;letter-spacing:-.02em;margin:0 0 11px;text-wrap:balance;color:#fff;}
  .cr-hero .lede{font-size:14px;color:#C4CAD2;max-width:60ch;line-height:1.55;}
  .cr-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
  .cr-chip{font-family:'Space Mono',monospace;font-size:10.5px;color:#E6E9ED;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;}
  .cr-chip b{color:#fff;font-weight:700;}

  .cr-b{padding:28px 34px 34px;}
  .cr-eyerow{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;}
  .cr-eyerow .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange-deep);}
  .cr-eyerow h2{font-weight:700;font-size:14px;letter-spacing:.01em;text-transform:uppercase;}
  .cr-eyerow .line{flex:1;height:1px;background:var(--line);}

  /* verdict cards */
  .cr-cards{display:grid;gap:13px;margin-bottom:16px;}
  .cr-qc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 18px 16px;overflow:hidden;}
  .cr-qc .role{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);}
  .cr-qc h3{font-weight:700;font-size:19px;letter-spacing:-.01em;margin:3px 0 12px;line-height:1.1;}
  .cr-qc .prem{font-family:'Space Grotesk','Libre Franklin',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1;}
  .cr-qc .per{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:5px;}
  .cr-qc .delta{margin-top:11px;font-size:12.5px;font-weight:600;}
  .cr-qc .delta .save{color:var(--green);} .cr-qc .delta .base{color:var(--muted);font-weight:600;}
  .cr-qc.win{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange),0 12px 30px rgba(244,119,46,.16);}
  .cr-qc.win::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--orange-hi),var(--orange-deep));}
  .cr-badge{position:absolute;top:13px;right:13px;font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--orange);color:#fff;padding:4px 9px;border-radius:999px;}

  /* savings chart */
  .cr-chart{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:19px 21px;margin-bottom:16px;}
  .cr-chart .ct{font-weight:700;font-size:13.5px;margin-bottom:2px;}
  .cr-chart .cs{font-size:11.5px;color:var(--muted);margin-bottom:15px;}
  .cr-bar{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:13px;margin-bottom:11px;}
  .cr-bar:last-child{margin-bottom:0;}
  .cr-bar .bl{font-weight:600;font-size:12.5px;}
  .cr-bar .bl small{display:block;font-family:'Libre Franklin',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);font-weight:400;}
  .cr-bar .track{position:relative;height:32px;background:var(--line-2);border-radius:8px;overflow:hidden;}
  .cr-bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:11px;color:#fff;font-family:'Libre Franklin',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;min-width:38px;}
  .cr-bar .fill.g{background:linear-gradient(90deg,#2A2E36,#3C424C);}
  .cr-bar .fill.o{background:linear-gradient(90deg,var(--orange-deep),var(--orange));}
  .cr-bar .zero{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);}

  /* alert */
  .cr-alert{display:flex;gap:12px;border:1px solid var(--red);background:var(--red-bg);border-radius:14px;padding:14px 16px;margin-bottom:26px;}
  .cr-alert svg{flex:none;width:21px;height:21px;color:var(--red);margin-top:1px;}
  .cr-alert .at{font-weight:700;font-size:13px;margin-bottom:3px;}
  .cr-alert p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-2);}
  .cr-alert b{color:var(--ink);} .cr-alert .num{color:var(--red);font-weight:700;}

  /* section + table */
  .cr-sec{margin-bottom:24px;}
  .cr-sh{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
  .cr-sh .ic{flex:none;width:32px;height:32px;border-radius:9px;background:var(--panel);color:var(--orange-hi);display:flex;align-items:center;justify-content:center;}
  .cr-sh .ic svg{width:17px;height:17px;}
  .cr-sh h2{font-weight:700;font-size:16px;letter-spacing:-.01em;}
  .cr-sh .sub{margin-left:auto;font-size:11px;color:var(--muted);font-style:italic;}
  .cr-tw{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--card);}
  .cr table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px;}
  .cr thead th{background:var(--panel);color:#E9ECEF;text-align:left;padding:9px 12px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-right:1px solid #2A2E36;white-space:nowrap;}
  .cr thead th.o{color:var(--orange-hi);} .cr thead th:last-child{border-right:none;}
  .cr tbody td{padding:8px 12px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);vertical-align:top;}
  .cr tbody td:last-child{border-right:none;} .cr tbody tr:last-child td{border-bottom:none;}
  .cr tbody tr:nth-child(even) td{background:#FCFBF9;}
  .cr td.item{font-weight:700;color:var(--ink);width:18%;min-width:130px;}
  .cr td.item small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;margin-top:2px;}
  .cr td.val{font-family:'Libre Franklin',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;width:14%;}
  .cr td.val .n{color:var(--ink);font-weight:700;}
  .cr td.val small{font-family:'Libre Franklin',sans-serif;color:var(--muted);font-size:10px;display:block;white-space:normal;margin-top:1px;letter-spacing:0;}
  .cr td.na{color:#AAB0B8;font-style:italic;font-family:'Libre Franklin',sans-serif;}
  .cr td.oc{background:#FFF7F1;} .cr tbody tr:nth-child(even) td.oc{background:#FEF3EA;}
  .cr td.verdict{width:30%;min-width:200px;font-size:11.5px;color:var(--ink-2);line-height:1.45;}
  .cr tr.tot td{background:#F0ECE4!important;} .cr tr.tot td.item{font-size:13px;} .cr tr.tot td.val .n{font-size:13.5px;}
  .cr-pill{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.02em;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px;white-space:nowrap;background:var(--ink);color:#fff;}
  .cr-pill.tie{background:var(--line);color:var(--ink-2);}
  .cr-pill.up{background:var(--green-bg);color:var(--green);box-shadow:inset 0 0 0 1px var(--green);}
  .cr-pill.gap{background:var(--red-bg);color:var(--red);box-shadow:inset 0 0 0 1px var(--red);}

  /* bottom line */
  .cr-reco{border:1px solid var(--orange);background:linear-gradient(180deg,#FFF7F1,#FFFCFA);border-radius:14px;padding:16px 18px;margin-top:4px;}
  .cr-reco .pl{font-family:'Space Mono',monospace;font-weight:700;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--orange-deep);margin-bottom:7px;}
  .cr-reco p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2);} .cr-reco b{color:var(--ink);}
  .cr-fine{font-size:10.5px;color:var(--muted);line-height:1.55;margin-top:20px;border-top:1px solid var(--line);padding-top:12px;}
  .cr-dctl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:9px;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--muted);}

  /* RM-only internal panel (hidden on the client copy) */
  .cr-rm{border:1px solid var(--orange);border-radius:15px;overflow:hidden;margin-bottom:18px;background:#fff;}
  .cr-rm-h{background:var(--panel);color:#fff;padding:15px 18px;}
  .cr-rm-k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-hi);font-weight:700;}
  .cr-rm-h h2{font-family:'Space Grotesk','Libre Franklin',sans-serif;font-weight:700;font-size:17px;margin:5px 0 3px;letter-spacing:-.01em;}

const el = (tag, props={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};
// Hoisted (function declaration) so blank()/load() can use it during the
// top-level `let state = load()` — a const arrow here would be in its TDZ.
function uid() { return Math.random().toString(36).slice(2, 9); }
const fmtSize = b => b < 1024 ? b+' B' : b < 1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(1)+' MB';

/* ---------- money ---------- */
function parseMoney(v) {
  if (v == null || v === '') return null;
  const s = String(v).replace(/[Rr]\s?/,'').replace(/\s/g,'').replace(/,(?=\d{3}\b)/g,'').replace(',','.');
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
}
function fmtR(n, sign=false) {
  if (n == null || !Number.isFinite(n)) return '—';
  const neg = n < 0; const a = Math.abs(n);
  const s = a.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '− ' : (sign && n > 0 ? '+ ' : '')) + 'R ' + s;
}

/* ---------- comparison math (mirror of the data contract) ---------- */
// Parse a cover limit / sum insured into a number: "R 38.72M" -> 38720000,
// "R 250 000" -> 250000. Text limits (Included / Statutory / Full value) -> null.
function parseLimit(str) {
  if (str == null) return null;
  const s = String(str).trim();
  if (!s || /included|statutory|full\s*value|not\s*quoted|—|^-$/i.test(s)) return null;
  const m = /([\d][\d\s.,]*)\s*([MmKk])?/.exec(s.replace(/[Rr]/g, ''));
  if (!m) return null;
  let n = parseFloat(m[1].replace(/\s/g, '').replace(/,(?=\d{3}\b)/g, ''));
  if (!Number.isFinite(n)) return null;
  if (m[2]) n *= /[Mm]/.test(m[2]) ? 1e6 : 1e3;
  return n;
}
function lineStatus(l) {
  if (l.propNq) return { delta: null, st: 'gap' };   // Cartrack didn't quote -> real gap
  const cur = l.cur, prop = l.prop;
  // Cartrack quoted where the current insurer gave no cover -> new cover won, not a gap.
  if (cur == null && prop != null) return { delta: null, st: 'added' };
  if (prop == null || cur == null) return { delta: null, st: 'gap' };
  const d = +(prop - cur).toFixed(2);
  return { delta: d, st: d < 0 ? 'saving' : d > 0 ? 'increase' : 'matched' };
}
// Per-line cover flags (from comparison-engine): a limit reduction and a
// coverage gap are advisory points even when the premium looks favourable.
function lineFlags(l) {
  const flags = [];
  const curHasCover = l.cur != null || l.curIncl || parseLimit(l.curL) != null;
  if (l.propNq) {
    flags.push({ kind: 'gap', text: curHasCover ? 'Not quoted — cover falls away' : 'Not quoted' });
    return flags;
  }
  const cl = parseLimit(l.curL), pl = parseLimit(l.propL);
  if (cl != null && pl != null && cl - pl > 0.5)
    flags.push({ kind: 'limit', text: 'Limit reduced by ' + fmtLimit(cl - pl) });
  return flags;
}
function quoteTotals(q) {
  let cur = 0, prop = 0, comparable = 0, gaps = 0, added = 0, curKnown = false;
  for (const l of q.lines) {
    const { st } = lineStatus(l);
    if (l.cur != null) { cur += l.cur; curKnown = true; }
    if (l.prop != null) prop += l.prop;
    if (st === 'gap') gaps++;            // current covered, Cartrack didn't quote
    else if (st === 'added') added++;    // Cartrack added cover the client didn't have
    else comparable++;
  }
  // curKnown: an unread current premium must show as unknown, never as R 0.00 —
  // "R 0.00 current vs R 16,967 proposed" reads as Cartrack costing more.
  return { cur: +cur.toFixed(2), prop: +prop.toFixed(2), delta: +(prop-cur).toFixed(2), comparable, gaps, added, curKnown };
}
const quotesOf = b => state.quotes.filter(q => q.buildingId === b.id);
function selQuote(b) {
  const qs = quotesOf(b);
  return qs.find(q => q.id === b.selQ) || qs[0] || null;
}
function portfolio() {
  let cur = 0, prop = 0, n = 0, curKnown = false;
  for (const b of state.buildings) {
    const q = selQuote(b); if (!q || !q.lines.length) continue;
    const t = quoteTotals(q); cur += t.cur; prop += t.prop; n++; if (t.curKnown) curKnown = true;
  }
  return { cur: +cur.toFixed(2), prop: +prop.toFixed(2), delta: +(prop-cur).toFixed(2), n, curKnown };
}

/* ---------- won-quote → RM book handoff ---------- */
// UTF-8-safe base64url so the payload survives a URL hash.
function b64urlEncode(obj) {
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
// Build a won-quote payload and open the RM System to add it to the book.
function sendToBook() {
  const quoted = state.buildings.filter(b => { const q = selQuote(b); return q && q.lines.length; });
  if (!quoted.length) { alert('Add at least one quote before sending to the book.'); return; }
  const client = (state.client.name || '').trim();
  if (!client) { alert('Enter the client name (Step 1) before sending to the book.'); return; }
  const p = portfolio();
  const insurers = [...new Set(quoted.map(b => (selQuote(b).insurer || 'Cartrack').trim()).filter(Boolean))];
  const payload = {
    v: 1, src: 'premium-comparison',
    rm: state.rmId,                    // matches the RM System rm_slug
    client,
    insurer: insurers.join(' / '),
    premiumMonthly: p.prop,            // total proposed monthly premium
    buildings: quoted.length,
    renewal: state.client.renewal || '',
    ts: Date.now(),
  };
  window.open(RM_SYSTEM_URL + '#import=' + b64urlEncode(payload), '_blank', 'noopener');
  clearDraft();   // handed off to the book — the on-device draft has done its job
}

/* ---------- OCR fallback for scanned PDFs (in-browser, Tesseract) ---------- */
async function ocrPdf(pdf, onProgress) {
  let Tesseract;
  try { Tesseract = await getTesseract(); }
  catch { throw new Error('Scanned file — OCR needs an internet connection the first time. Connect and retry, or ask for a digital (text) PDF.'); }
  const worker = await Tesseract.createWorker('eng');
  let out = '';
  try {
    for (let p = 1; p <= pdf.numPages; p++) {
      if (onProgress) onProgress(p, pdf.numPages);
      const page = await pdf.getPage(p);
      const viewport = page.getViewport({ scale: 2 }); // 2x = sharper text for OCR
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      await page.render({ canvasContext: ctx, viewport }).promise;
      const { data: { text } } = await worker.recognize(canvas);
      out += text + '\n';
      canvas.width = 0; canvas.height = 0; // release memory between pages
    }
  } finally {
    await worker.terminate();
  }
  return out.trim();
}

/* ---------- Local extraction ---------- */
async function extractText(file, onProgress) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.pdf')) {
    const buf = await file.arrayBuffer();
    const pdfjsLib = await getPdfjs();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      out += tc.items.map(i => i.str).join(' ') + '\n';
    }
    // A scanned (image-only) PDF has essentially no selectable text. When the
    // real text layer comes back near-empty, fall back to OCR — render each page
    // to an image and read it optically. Threshold scales with page count.
    if (out.replace(/\s/g, '').length < Math.max(40, pdf.numPages * 8)) {
      const ocr = await ocrPdf(pdf, onProgress);
      if (ocr.replace(/\s/g, '').length > out.replace(/\s/g, '').length) {
        return { text: ocr, sheets: null, ocr: true };
      }
    }
    return { text: out.trim(), sheets: null };
  }
  if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
    const buf = await file.arrayBuffer();
    const XLSX = await getXLSX();
    const wb = XLSX.read(buf, { type: 'array' });
    // Sheet names are captured here, from the workbook itself — never from the
    // (possibly truncated) text — so every building tab is always detected.
    // Each sheet's text is capped individually so all tabs stay represented.
    const text = wb.SheetNames.map(sn =>
      '### ' + sn + '\n' + XLSX.utils.sheet_to_csv(wb.Sheets[sn]).slice(0, 35000)).join('\n\n').trim();
    return { text, sheets: [...wb.SheetNames] };
  }
  throw new Error('Unsupported file type');
}
async function addFiles(panel, fileList, optionId) {
  for (const f of fileList) {
    const rec = { id: uid(), name: f.name, size: f.size, status: 'busy', text: '', error: '',
      optionId: optionId || null,
      kind: /\.xlsx?$/i.test(f.name) ? 'XLSX' : 'PDF' };
    if (f.size > 20 * 1048576) { rec.status = 'err'; rec.error = 'Over 20 MB limit'; }
    if (state.files[panel].length >= 20) { alert('Maximum 20 files per panel.'); break; }
    state.files[panel].push(rec); state.seeded = false; save(); render();
    if (rec.status === 'err') continue;
    try {
      const onProgress = (p, n) => { rec.ocrMsg = `Scanned file — reading page ${p} of ${n}…`; save(); render(); };
      const { text, sheets, ocr } = await extractText(f, onProgress);
      rec.text = text.slice(0, 200000); // keep sessionStorage sane
      rec.chars = text.length;
      rec.sheets = sheets;              // authoritative building-tab list (XLSX)
      rec.ocr = !!ocr;                  // was this read via OCR?
      rec.ocrMsg = '';
      rec.status = 'ok';
    } catch (e) { rec.status = 'err'; rec.ocrMsg = ''; rec.error = (e && e.message) || 'Could not read file'; }
    save(); render();
  }
}
function removeFile(panel, id) {
  state.files[panel] = state.files[panel].filter(f => f.id !== id);
  state.seeded = false; save(); render();
}

/* ---------- Seeding: extracted text → editable structure ---------- */
function cleanName(fn) { return fn.replace(/\.(pdf|xlsx?|xls)$/i,'').replace(/[_-]+/g,' ').trim(); }
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function guessQuoteNo(text, fname) {
  // Explicit "quote number" label wins; then a 7–9 digit run in the filename
  // (e.g. "Proposal - 48517097 (R7,874.57).pdf"); then other labelled refs.
  // Never fall back to bare digit runs — those match VAT/Reg numbers.
  let m = /quote\s*(?:number|no\.?|#)?\s*[:#]?\s*(\d{5,12})/i.exec(text || '');
  if (m) return m[1];
  m = /(\d{7,9})/.exec(fname || ''); if (m) return m[1];
  m = /(?:quotation|proposal|ref(?:erence)?)\s*(?:number|no\.?)?\s*[:#]?\s*(\d{5,12})/i.exec(text || '');
  return m ? m[1] : '';
}
function guessInsurer(text, fname) {
  const hay = (fname + ' ' + (text || '')); // scan the full text, not a prefix
  for (const ins of INSURERS) {
    // "Western" the insurer must not fire on "Western Cape" — the province is
    // in half of all SA policy wordings (a Bryte quote once headed "Cartrack ·
    // Western" off its territorial clause).
    const re = ins === 'Western' ? /\bwestern\b(?!\s+cape)/i : new RegExp('\\b' + esc(ins) + '\\b', 'i');
    if (re.test(hay)) return ins;
  }
  return '';
}
// The quotes panel holds Cartrack proposals, so the proposed insurer is
// Cartrack — with the underwriter appended when one is detected.
function proposedInsurer(text, fname) {
  const u = guessInsurer(text, fname);
  return u && !/cartrack/i.test(u) ? 'Cartrack · ' + u : 'Cartrack';
}
/* Building name from a schedule filename: strip leading dates, insurer and
   document words — "2026-03-01 Brett Park Office Park Bryte Renewal Policy
   Schedule.pdf" → "Brett Park Office Park". Lets the two-PDFs-per-building
   pattern (e.g. Bryte + AIG XOL) dedupe into one building. */
const DOC_WORDS = /\b(renewal|policy|schedule|proposal|quote|quotation|umbrella|liability|xol|commercial)\b/gi;
function buildingNameFromFile(fname) {
  let n = cleanName(fname);
  n = n.replace(/^\s*\d{4}[ .\/-]\d{1,2}[ .\/-]\d{1,2}\s*/, '');
  n = n.replace(new RegExp('\\b(' + INSURERS.map(esc).join('|') + ')\\b', 'gi'), '');
  n = n.replace(DOC_WORDS, '').replace(/\s{2,}/g, ' ').trim();
  return n || cleanName(fname);
}
/* When the filename is an opaque code (OT106190151…, BUILDINGMAINTENANCE0521),
   pull the name from inside the document: the insured-name block first, the
   risk address as fallback. */
function buildingNameFromText(text) {
  // PDF text arrives without line breaks, so the captured chunk is cut at a
  // natural entity suffix (Body Corporate, HOA, (Pty) Ltd) or a stop word.
  let m = /(?:policy\s*holder|the insured|insured name|name of insured)\s*[:\-]?\s+([^\n]{4,90})/i.exec(text || '');
  let raw = m ? m[1] : '';
  if (!raw) {
    m = /(?:risk address|situation address|situated at)\s*[:\-]?\s+([^\n]{4,90})/i.exec(text || '');
    raw = m ? m[1] : '';
  }
  if (!raw) return '';
  raw = raw.replace(/\s{2,}/g, ' ').trim();
  const suffix = /^(.*?\b(?:body corporate|home\s?owners association|hoa|\(pty\) ltd|proprietary limited|cc))\b/i.exec(raw);
  if (suffix) return suffix[1].trim();
  const stop = raw.search(/\b(for attention|attention|vat|physical|postal|suburb|town|province|company|registration|reg no|address)\b/i);
  if (stop > 3) return raw.slice(0, stop).trim();
  return raw.split(/\s+/).slice(0, 6).join(' ');
}
function looksLikeCode(name) {
  return name.split(/\s+/).length < 2 || /\d{5,}/.test(name);
}

/* ---------- figure pre-fill: parse premiums out of the documents ---------- */
const titleCase = s => s.toLowerCase().replace(/(^|[\s(\/&-])([a-z])/g, (m,a,b) => a + b.toUpperCase()).replace(/\bSasria\b/i,'SASRIA');
const fmtLimit = n => n == null ? '' : n >= 1e6 ? 'R ' + (n/1e6).toFixed(2) + 'M' : 'R ' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

/* Proposal (quote PDF): "SUMMARY OF COVER … DESCRIPTION MONTHLY PREMIUM
   BUILDINGS COMBINED R1 876,23 … TOTAL PREMIUM: R7 874,57".
   SASRIA sub-rows are summed into one SASRIA line; ASSIST becomes fees. */
/* Bryte quote summary: "Section of Cover  Items  Cover Inc.  Sasria Included
   Sum Insured  Monthly Premium" — rows of `name  count  Yes  Yes|N/A
   [R sum-insured]  R premium`, then Cover Sub-Total / Sasria Sub-Total /
   Fee Sub-Total / Total Monthly Payment. Accepted ONLY when the rows sum to
   the Cover Sub-Total and the sub-totals sum to the Total Monthly Payment. */
function parseProposalBryte(text) {
  const start = /Section of Cover\s+Items\s+Cover\s+Inc/i.exec(text || '');
  if (!start) return null;
  const region = text.slice(start.index, start.index + 3000);
  const rows = [];
  for (const m of region.matchAll(/([A-Z][A-Za-z &\/'()\-]{2,45}?)\s+\d{1,3}\s+(?:Yes|No)\s+(?:Yes|No|N\/A)\s+(?:R([\d ,.]*\d)\s+)?R([\d ,.]*\d\.\d{2})/g)) {
    const name = m[1].trim().split(/\s{2,}/).pop().trim();  // drop glued header/cell text
    if (!name || /SECTION|PREMIUM|SUMMARY|TOTAL|INSURED/i.test(name)) continue;
    const amt = parseMoney2(m[3]);
    if (amt == null || amt <= 0) continue;
    rows.push({ s: name.length <= 4 ? name : titleCase(name), amt, si: m[2] ? parseMoney(m[2]) : null });
  }
  if (rows.length < 2) return null;
  const g1 = re => { const m = re.exec(region); return m ? parseMoney2(m[1]) : null; };
  const coverSub = g1(/Cover Sub-?Total\s+R([\d ,.]*\d)/i);
  const sasSub = g1(/Sasria Sub-?Total\s+R([\d ,.]*\d)/i);
  const feeSub = g1(/Fee Sub-?Total\s+R([\d ,.]*\d)/i);
  const total = g1(/Total Monthly Payment\s+R([\d ,.]*\d)/i);
  const sum = +rows.reduce((s, r) => s + r.amt, 0).toFixed(2);
  if (coverSub == null || Math.abs(sum - coverSub) > 2) return null;
  if (total != null && Math.abs(coverSub + (sasSub || 0) + (feeSub || 0) - total) > 2) return null;
  if (sasSub) rows.push({ s: 'SASRIA', amt: sasSub });
  if (feeSub) rows.push({ s: 'Broker & admin fees', amt: feeSub });
  return { rows, zeroSections: [], total: total != null ? total : +(coverSub + (sasSub || 0) + (feeSub || 0)).toFixed(2) };
}
function parseProposalProp(text) {
  const bry = parseProposalBryte(text);
  if (bry) return bry;
  const start = /SUMMARY OF COVER/i.exec(text || '');
  if (!start) return { rows: [], total: null };
  const endM = /TOTAL PREMIUM\s*:?\s*R([\d ]+(?:,\d{2})?)/i.exec(text.slice(start.index));
  const region = text.slice(start.index, endM ? start.index + endM.index : start.index + 4000);
  const rows = []; const zeroSections = []; let sasria = 0, fees = 0;
  for (const m of region.matchAll(/([A-Z][A-Z &\/'()\-]{2,40}?)\s+R([\d ]+(?:,\d{2})?)/g)) {
    // Rows can arrive glued to preceding header text. Column gaps are runs of
    // 2+ spaces while names use single spaces — the name is the last segment.
    const name = m[1].trim().split(/\s{2,}/).pop().trim();
    if (!name || /SUMMARY|TOTAL|DESCRIPTION|COMMISSION|VAT/i.test(name)) continue;
    const amt = parseMoney(m[2]);
    if (amt == null) continue;
    if (amt === 0) { zeroSections.push(titleCase(name)); continue; } // listed at R0,00 = included at no premium
    if (/SASRIA/i.test(name)) { sasria += amt; continue; }
    if (/^ASSIST/i.test(name)) { fees += amt; continue; }
    rows.push({ s: titleCase(name), amt });
  }
  if (sasria) rows.push({ s: 'SASRIA', amt: +sasria.toFixed(2) });
  if (fees) rows.push({ s: 'Broker & assist fees', amt: +fees.toFixed(2) });
  return { rows, zeroSections, total: endM ? parseMoney(endM[1]) : null };
}

/* OUTsurance summary: "Fire* Yes R1,079.95 Buildings combined* Yes R6,343.71
   Office contents No Theft Yes R537.62 …" — each section is name + Yes/No +
   (premium when Yes). Plus a stated SASRIA and total. */
function parseScheduleOUT(text) {
  const start = /Fire\*?\s+(?:Yes|No)\b/i.exec(text || '');
  if (!start) return null;
  const region = text.slice(start.index, start.index + 2000);
  const rows = [];
  for (const m of region.matchAll(/([A-Za-z][A-Za-z ()\-\/&]*?)\*?\s+(Yes|No)\b(?:\s+R([\d,]+\.\d{2}))?/g)) {
    if (!/yes/i.test(m[2]) || !m[3]) continue;                 // only sections held, with a premium
    const name = m[1].replace(/^[a-z]+\s+/, '').trim();        // strip leading word fragment (e.g. "ium ")
    const amt = parseMoney(m[3]);
    if (!name || amt == null) continue;
    rows.push({ s: titleCase(name), amt, si: null });
  }
  let m = /SASRIA premium\s+R([\d,]+\.\d{2})/i.exec(text);
  if (m && parseMoney(m[1])) rows.push({ s: 'SASRIA', amt: parseMoney(m[1]) });
  m = /Total premium\s*\(Including VAT\)\s+R([\d,]+\.\d{2})/i.exec(text);
  return { rows, total: m ? parseMoney(m[1]) : null };
}
/* Frontline UMA / Old Mutual Insure schedule (Ballast-style): "SUMMARY OF
   COVER AND PREMIUM PAYABLE" table — one row per section, "Yes" + one or two
   amounts (pro-rata first, monthly last; comma decimals), then a reversed
   footer: "R21 741,84 R828,78 Sub-Total: R184,88 Sasria: R496,63 Fees:
   Total: R828,78 R22 423,35". Accepted ONLY when the rows reconcile: section
   sum ≈ one of the Sub-Total figures AND sub + SASRIA + fees ≈ one of the
   Total figures — otherwise return null and let the caller fall through. */
function parseScheduleFrontline(text) {
  const start = /SUMMARY OF COVER AND PREMIUM PAYABLE/i.exec(text || '');
  if (!start) return null;
  const region = text.slice(start.index, start.index + 4500);
  const rows = [];
  for (const m of region.matchAll(/([A-Z][A-Za-z &\/'()\-]{2,45}?)\s+Yes\s+R([\d .,]*\d)(?:\s+R([\d .,]*\d))?\s+(?=Yes\b|Not\s+Applicable)/g)) {
    // column runs can glue the previous cell onto the name — keep the last segment
    const name = m[1].trim().split(/\s{2,}/).pop().trim();
    if (!name || /SUMMARY|SECTION|PREMIUM|TOTAL|COVER TAKEN|APPLICABLE/i.test(name)) continue;
    const amt = parseMoney2(m[3] || m[2]);   // monthly is the LAST amount on the row
    if (amt == null || amt <= 0) continue;
    rows.push({ s: name.length <= 4 ? name : titleCase(name), amt, si: null });
  }
  if (rows.length < 2) return null;
  const sum = +rows.reduce((s, r) => s + r.amt, 0).toFixed(2);
  const sub = /R([\d .,]*\d)\s+R([\d .,]*\d)\s+Sub-?Total:/i.exec(region);
  const sas = /R([\d .,]*\d)\s+Sasria:/i.exec(region);
  const fee = /R([\d .,]*\d)\s+Fees:/i.exec(region);
  const tot = /Total:\s+R([\d .,]*\d)\s+R([\d .,]*\d)/i.exec(region);
  const subM = sub ? [parseMoney2(sub[1]), parseMoney2(sub[2])].find(v => v != null && Math.abs(v - sum) <= 2) : null;
  if (subM == null) return null;
  const sasV = sas ? parseMoney2(sas[1]) : null;
  const feeV = fee ? parseMoney2(fee[1]) : null;
  const allIn = +(subM + (sasV || 0) + (feeV || 0)).toFixed(2);
  const totV = tot ? [parseMoney2(tot[1]), parseMoney2(tot[2])].find(v => v != null && Math.abs(v - allIn) <= 2) : null;
  if (totV == null) return null;
  if (sasV) rows.push({ s: 'SASRIA', amt: sasV });
  if (feeV) rows.push({ s: 'Broker & admin fees', amt: feeV });
  return { rows, total: totV };
}
/* Schedule (e.g. Bryte): "PREMIUM SCHEDULE AND INDEX OF COVER … BUILDINGS
   COMBINED NO YES 2 351.10 R R - R 2 38 717 000 …", then Sasria / fees /
   additional-services and a stated TOTAL. Dispatches to OUTsurance when the
   Bryte-style index is absent. */
function parseScheduleCur(text) {
  const fl = parseScheduleFrontline(text);
  if (fl) return fl;
  const start = /PREMIUM SCHEDULE AND INDEX OF COVER/i.exec(text || '');

  const insurerFor = f => { const o = optOf(f); return (multiOpt && o && o.insurer && o.insurer.trim()) ? o.insurer.trim() : proposedInsurer(f.text, f.name); };
  const optIdFor = f => f.optionId || (state.options && state.options[0] && state.options[0].id) || null;
  for (const f of state.files.quote) {
    if (f.status !== 'ok') continue;
    const existing = existingBySrc.get(f.id);
    // Rebrand a bare underwriter name (e.g. "Western") — keep anything already branded.
    if (existing && (!existing.insurer || !/cartrack/i.test(existing.insurer) || multiOpt))
      existing.insurer = insurerFor(f);
    if (existing && !existing.optionId) existing.optionId = optIdFor(f);
    const bldExisting = existing ? state.buildings.find(x => x.id === existing.buildingId) : null;
    if (existing && existing.lines.length) {
      backfillCurrent(existing, (bldExisting && bldExisting.__curRows) || []);  // fill newly-parsed current figures
      continue;                                          // keep RM-entered data otherwise
    }
    const bld = bldExisting || matchBuilding(f.name + ' ' + (f.text || '')) || state.buildings[0];
    const prop = parseProposalProp(f.text);
    f.readNote = prop.rows.length >= 2 ? { k: 'item' }
      : prop.total != null ? { k: 'total', why: 'summary table not recognised — only the total premium was read' }
      : { k: 'none', why: 'no readable quote layout found' };
    const q = existing || newQuote(bld.id, insurerFor(f), guessQuoteNo(f.text, f.name));
    q.optionId = optIdFor(f);
    q.lines = buildComparisonLines(bld.__curRows || [], prop);
    q.totalStated = prop.total;
    if (!bld.addr) { const a = riskAddressFromText(f.text); if (a) bld.addr = a; }
    if (!existing) { q.srcId = f.id; state.quotes.push(q); }
  }
  for (const b of state.buildings) delete b.__curRows;
  for (const q of state.quotes) mergeDuplicateSections(q);  // fold equivalent sections
  // Safety net: if property reading pulled no figures but the documents are
  // clearly a vehicle fleet, switch to the fleet reader automatically and set
  // the client type to match — rescues the case where the type was left wrong.
  const gotFigures = state.quotes.some(q => (q.lines || []).some(l => l.prop != null || l.cur != null))
    || state.buildings.some(b => b.si);
  if (!gotFigures) {
    // The detailed section reader found nothing (a layout it doesn't recognise) —
    // fall back to the generic headline-premium reader so the comparison still works.
    state.buildings.length = 0; state.quotes.length = 0;
    genericSeed();
    return;
  }
  seedVehiclesAndTerms();
  state.seeded = true; save();
}

/* ============================================================
   MAGIC CLIENT REPORT — auto-verdict comparison renderer.
   Reuses the existing data model (optionPortfolio / optionQuotes /
   sectionUnion / curCellFor / quoteTotals / parseLimit / fmtLimit).
   ============================================================ */
function crEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// Comma-thousands money to match the report template ("R450,735" / "R5,988.40").
function crMoney(n, dec = 2) {
  if (n == null || !Number.isFinite(n)) return '—';
  const s = Math.abs(n).toFixed(dec);
  const [i, f] = s.split('.');
  const ii = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (n < 0 ? '−R' : 'R') + ii + (f ? '.' + f : '');
}
// Classify a cover section so the verdict knows what "winning" means.
function crKind(label) {
  const s = (label || '').toLowerCase();
  if (/sasria/.test(s)) return 'sasria';
  if (/excess/.test(s)) return 'excess';
  if (/liabilit|third[\s-]?party|passenger|broadform|public liab|indemnit/.test(s)) return 'liability';
  if (/sum insured|goods in transit|\bgit\b|limit of|\bcover\b/.test(s)) return 'cover';
  // Fees and VAT are charges, not cover sections — a proposal that doesn't
  // charge them must never read as a cover GAP on the client report.
  if (/broker|admin(istration)?\s*fee|policy fee|risk services|\bassist\b|\bvat\b|\bfees?\b/.test(s)) return 'fees';
  return 'premium';
}
// Read an excess descriptor into a comparable value. "Nil"/"None"/"R0" -> 0;
// a plain rand amount -> that amount; anything percentage-based (e.g.
// "10% min R10,000") -> null, because those can't be compared on amount alone.
function crExcessVal(str) {
  if (str == null) return null;
  const s = String(str).trim().toLowerCase();
  if (!s) return null;
  if (/\b(nil|none|no excess|zero)\b/.test(s) || /^r?\s*0([.,]0+)?$/.test(s)) return 0;
  if (/%/.test(s)) return null;
  return parseLimit(s);
}
// Cover-section cell text.
function crCurTxt(l) {
  if (!l) return '—';
  if (l.cur == null) return l.curStr || (l.curIncl ? 'Included' : '—');
  return l.curIncl ? 'Included' : crMoney(l.cur);
}
function crPropTxt(l) {
  if (!l || l.propNq) return 'Not quoted';
  if (l.prop == null) return l.propStr || '—';
  return l.propIncl ? 'Included' : crMoney(l.prop);
}
// The heart of "magic": decide the winner of one cover line and say why.
// Competitors are the current schedule plus every proposal option.
function crLineVerdict(kind, curCell, cells, opts) {
  const comp = [];
  if (curCell && (curCell.cur != null || curCell.curL || curCell.curIncl))
    comp.push({ who: 'Current', prem: curCell.curIncl ? 0 : curCell.cur, lim: parseLimit(curCell.curL), key: '__cur' });
  opts.forEach((o, i) => {
    const l = cells[i];
    if (l && !l.propNq) comp.push({ who: o.insurer, prem: l.propIncl ? 0 : l.prop, lim: parseLimit(l.propL), key: o.key });
  });
  const cell = (pills, txt) => el('td', { class: 'verdict' }, ...pills, txt);
  const pill = (cls, t) => el('span', { class: 'cr-pill' + (cls ? ' ' + cls : '') }, t);
  const names = arr => [...new Set(arr.map(c => c.who))].join(' & ');

  if (kind === 'sasria') {
    // Same tariff everywhere — but a big premium gap means the DECLARED VALUE
    // (the Sasria base) differs, and that is worth querying, not waving off.
    const curP = curCell ? (curCell.curIncl ? 0 : curCell.cur) : null;
    let maxDiff = 0;
    opts.forEach((o, i) => { const l = cells[i]; if (l && !l.propNq && l.prop != null && curP != null) maxDiff = Math.max(maxDiff, Math.abs(l.prop - curP)); });
    if (curP != null && maxDiff > Math.max(100, curP * 0.15))
      return cell([pill('tie', 'Statutory')], 'A government tariff at the same rate for every insurer — the gap here comes from the declared value (the Sasria base), not the insurer’s own price. Query the base before inception.');
    return cell([pill('tie', 'Statutory')], 'A fixed government tariff — effectively equal across all; not a decision factor.');
  }

  if (kind === 'liability' || kind === 'cover') {
    const lim = comp.filter(c => c.lim != null);
    if (lim.length) {
      const best = Math.max(...lim.map(c => c.lim));
      const winners = lim.filter(c => c.lim === best);
      const curLim = curCell ? parseLimit(curCell.curL) : null;
      const propBest = Math.max(...lim.filter(c => c.key !== '__cur').map(c => c.lim).concat([-1]));
      const improves = curLim != null && propBest > curLim + 0.5;
      const pills = [];
      if (improves) pills.push(pill('up', 'Cover ↑'));
      const allProp = winners.every(w => w.key !== '__cur') && winners.length === opts.length && opts.length > 1;
      pills.push(allProp ? pill('tie', names(winners)) : pill('', names(winners)));
      let txt = names(winners) + (winners.length > 1 ? ' carry' : ' carries') + ' the highest limit at ' + fmtLimit(best);
      if (improves) {
        const mult = curLim > 0 ? propBest / curLim : null;
        txt += (mult && mult >= 1.5) ? ' — ' + (Math.round(mult * 10) / 10) + '× the current ' + fmtLimit(curLim) + '.'
                                     : ' vs the current ' + fmtLimit(curLim) + '.';
      } else txt += '.';
      return cell(pills, txt);
    }
  }

  if (kind === 'excess') {
    const items = [];
    if (curCell) items.push({ who: 'Current', v: crExcessVal(curCell.curStr || curCell.curL) });
    opts.forEach((o, i) => { const l = cells[i]; if (l && !l.propNq) items.push({ who: o.insurer, v: crExcessVal(l.propStr || l.propL) }); });
    const nils = items.filter(x => x.v === 0);
    if (nils.length && !nils.some(x => x.who === 'Current'))
      return cell([pill('', names(nils))], names(nils) + (nils.length > 1 ? ' carry' : ' carries') + ' no excess on this line — the strongest position at claim stage.');
    const known = items.filter(x => x.v != null);
    if (items.length && items.every(x => x.v != null)) {
      const best = Math.min(...items.map(x => x.v));
      const winners = items.filter(x => x.v === best);
      return cell([pill('', names(winners))], names(winners) + ' has the lowest excess (' + (best === 0 ? 'nil' : fmtLimit(best)) + ') on this line.');
    }
    return cell([pill('tie', 'Compare wording')], 'Excess terms differ in basis (percentage vs fixed) — compare the policy wording before deciding.');
  }

  // fees / VAT — a charge only the current policy carries is a saving, not a gap
  if (kind === 'fees') {
    const fr = comp.filter(c => c.prem != null);
    if (fr.length === 1 && fr[0].key === '__cur')
      return cell([pill('tie', 'Fee')], 'A fee or levy on the current policy, not a cover section — the proposal does not charge it separately. No cover impact.');
    // both sides charge it → fall through to the premium comparison below
  }

  // premium line — lowest monthly premium wins
  const pr = comp.filter(c => c.prem != null);
  if (!pr.length) return cell([pill('gap', 'Gap')], 'Not quoted by the compared options — flag to the client.');
  if (pr.length === 1) {
    if (pr[0].key === '__cur') return cell([pill('gap', 'Gap')], 'Only the current schedule covers this line — the proposals did not quote it. Flag to the client.');
    return cell([pill('', pr[0].who)], 'Only ' + pr[0].who + ' prices this line' + (pr[0].prem === 0 ? ' — at no charge.' : ', at ' + crMoney(pr[0].prem) + '/mo.'));
  }
  const best = Math.min(...pr.map(c => c.prem));
  const winners = pr.filter(c => c.prem === best);
  const curPrem = curCell ? (curCell.curIncl ? 0 : curCell.cur) : null;
  const pills = [pill('', names(winners))];
  let txt = names(winners) + (winners.length > 1 ? ' are' : ' is') + ' lowest at ' + (best === 0 ? 'no charge' : crMoney(best) + '/mo');
  if (curPrem != null && best < curPrem - 0.5 && !winners.some(w => w.key === '__cur'))
    txt += ' — ' + crMoney(curPrem - best) + '/mo under the current premium.';
  else txt += '.';
  return cell(pills, txt);
}

// Largest limit increase across the whole comparison — drives the cover alert.
function crBiggestUpgrade(buildings, onlyKey) {
  let top = null;
  for (const b of buildings) {
    const opts = optionQuotes(b);
    sectionUnion(opts).forEach(sec => {
      const curCell = curCellFor(opts, sec.key);
      const curLim = curCell ? parseLimit(curCell.curL) : null;
      if (curLim == null) return;
      let best = -1, names = [];
      opts.forEach(q => { if (onlyKey && (q.optionId || q.id) !== onlyKey) return;   // attribute to one option only
        const l = q.lines.find(x => secKey(x.s) === sec.key); const pl = l && !l.propNq ? parseLimit(l.propL) : null;
        if (pl != null) { if (pl > best) { best = pl; names = [q.insurer || 'Cartrack']; } else if (pl === best) names.push(q.insurer || 'Cartrack'); } });
      if (best > curLim + 0.5) {
        const gain = best - curLim;
        if (!top || gain > top.gain) top = { label: sec.label, curLim, best, gain, names: [...new Set(names)], mult: curLim > 0 ? best / curLim : null };
      }
    });
  }
  return top;
}

function crVerdictCards(op) {
  const cards = [el('div', { class: 'cr-qc' },
    el('div', { class: 'role' }, 'Current schedule'),

  // "lowest total" must state a fact about price — the recommended option can
  // be a dearer one that holds cover the cheapest drops (dearer-but-better).
  const lowest = op.options.length ? Math.min(...op.options.map(x => x.prop)) : null;
  op.options.forEach((o, i) => {
    const isRec = o.key === op.recId && op.options.length > 1;

      el('div', { class: 'delta' }, op.cur ? (save > 0.5

function crSavingsChart(op) {

function crBuildingSection(b, opts, recId, idx, hhRow, insMap) {
  const secs = sectionUnion(opts);

      if (save < -0.5) return el('span', {}, el('span', { class: 'cr-pill' }, name), crMoney(-save) + '/mo more than today — the line verdicts above show what the extra buys.');
